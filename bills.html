<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bills — Open Congress</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="nav"></div>
<h1>Bills</h1>
<p class="sub" id="sub"></p>
<div class="chips">
  <select id="cg"></select>
  <span id="views"></span>
  <input id="find" type="search" placeholder="Search all collected bills by title or number" style="flex:1 1 260px;max-width:420px;width:auto">
</div>
<div class="chips" id="pfx" style="align-items:center"></div>
<form class="chips" id="goform" style="align-items:center"><b style="font-size:14px">Go to a bill number:</b>
  <select id="gt"><option value="HR">H.R.</option><option value="S">S.</option><option value="HRES">H.Res.</option><option value="SRES">S.Res.</option><option value="HJRES">H.J.Res.</option><option value="SJRES">S.J.Res.</option><option value="HCONRES">H.Con.Res.</option><option value="SCONRES">S.Con.Res.</option></select>
  <input id="gn" type="number" min="1" step="1" placeholder="Number" style="width:110px" required><button type="submit">Go</button>
</form>
<p class="small" id="count"></p>
<div id="sbar" class="small" style="margin:6px 0"></div>
<div id="pg1"></div>
<div id="list"></div>
<div id="pg2"></div>
<p class="small" id="cov"></p>
<p class="foot">Data: Congress.gov</p>
<script src="site.js"></script>
<script>
var esc=Site.esc,CG=119,VIEW="recent",SIZE=50,LO=1,HI=1,PFX="",CHM="",ALL=null,META=null,TB={},DIR={},VIDX=[],LAWS=[],RECENT=[];
var VIEWS=[["recent","All bills, newest first"],["most","Most cosponsors"],["voted","Voted on"],["law","Signed into law"],["subjects","By subject"]];
var TYPES={HR:1,S:1,HRES:1,SRES:1,HJRES:1,SJRES:1,HCONRES:1,SCONRES:1};
var PFXS=[["HR","H.R."],["S","S."],["HRES","H.Res."],["SRES","S.Res."],["HJRES","H.J.Res."],["SJRES","S.J.Res."],["HCONRES","H.Con.Res."],["SCONRES","S.Con.Res."]];
function pass(r){return(!PFX||r.y===PFX)&&(!CHM||String(r.y).charAt(0)===CHM)}
function filtering(){return!!(PFX||CHM)}
function csTot(r){return(r.cd||0)+(r.cr||0)+(r.ci||0)}
function pc(p){return p==="D"||p==="R"?p:"I"}
function row(r){
  var label=Site.billLabel(r.y+" "+r.n),href="bill.html?congress="+CG+"&type="+encodeURIComponent(r.y)+"&number="+r.n;
  var m=[];
  if(r.d)m.push((r.kind==="vote"?"Last vote ":r.kind==="law"?"Signed ":"Introduced ")+Site.fmtDate(r.d));
  if(r.s&&DIR[r.s])m.push("Sponsor: "+esc(DIR[r.s].first+" "+DIR[r.s].last)+" ("+r.sp+")");
  var cs=[];if(r.cd)cs.push(r.cd+" D");if(r.cr)cs.push(r.cr+" R");if(r.ci)cs.push(r.ci+" other");
  if(cs.length)m.push("Cosponsors: "+csTot(r)+" ("+cs.join(", ")+")");
  if(r.votes)m.push(r.votes+" roll call vote"+(r.votes>1?"s":""));
  var law=r.l?' <span class="law">Law '+esc(r.l)+"</span>":"";
  var title=r.t||TB[r.y+" "+r.n]||"";
  return'<a class="row" href="'+href+'"><div class="t"><b>'+esc(label)+"</b>"+law+"</div>"+(title?'<div class="tt">'+esc(Site.clip(title,260))+"</div>":"")+(r.m?'<div class="tt" style="color:var(--muted);font-size:13px">'+esc(Site.clip(r.m,200))+"</div>":"")+'<div class="m">'+m.map(function(x){return x.indexOf("Sponsor")===0?x:esc(x)}).join(" · ")+"</div></a>";
}
function current(){var rows=current0();return rows&&filtering()?rows.filter(pass):rows}
function current0(){
  var q=document.getElementById("find").value.toLowerCase().trim();
  if(VIEW==="subjects"&&SUBJ&&!q){
    if(!ALL||!SD)return null;
    var idx={};ALL.forEach(function(r){idx[r.y+" "+r.n]=r});
    return subjectKeys().map(function(k){var p=k.split(" ");return idx[k]||{y:p[0],n:parseInt(p[1],10),t:"",d:""}}).sort(function(a,b){return(b.d||"")<(a.d||"")?-1:(b.d||"")>(a.d||"")?1:b.n-a.n});
  }
  if(q){
    if(!ALL)return null;
    var ex=q.toUpperCase().replace(/[.\s]/g,"").match(/^([A-Z]+)(\d+)$/);
    if(ex&&TYPES[ex[1]]){var xt=ex[1],xn=parseInt(ex[2],10);return ALL.filter(function(r){return r.y===xt&&r.n===xn})}
    var toks=q.split(/\s+/);
    return ALL.filter(function(r){var h=(Site.billLabel(r.y+" "+r.n)+" "+r.y+" "+r.n+" "+r.t).toLowerCase();return toks.every(function(t){return h.indexOf(t)>-1})}).sort(function(a,b){return(b.d||"")<(a.d||"")?-1:1});
  }
  if(VIEW==="recent"){
    if(!ALL)return META?null:RECENT;
    if(!ALL.sortedNew)ALL.sortedNew=ALL.slice().sort(function(a,b){return(b.d||"")<(a.d||"")?-1:(b.d||"")>(a.d||"")?1:b.n-a.n});
    return ALL.sortedNew;
  }
  if(VIEW==="most"){if(!ALL)return null;return ALL.filter(function(r){return csTot(r)>0}).sort(function(a,b){return csTot(b)-csTot(a)||((b.d||"")<(a.d||"")?-1:1)})}
  if(VIEW==="law")return LAWS;
  var by={};
  VIDX.forEach(function(v){if(!v.bill)return;var m=v.bill.match(/^([A-Za-z]+)\s*(\d+)$/);if(!m)return;var k=m[1].toUpperCase()+" "+m[2];
    var o=by[k]||(by[k]={y:m[1].toUpperCase(),n:parseInt(m[2],10),d:"",votes:0,kind:"vote"});o.votes++;if((v.date||"")>o.d)o.d=v.date||""});
  return Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return(b.d||"")<(a.d||"")?-1:1});
}
async function loadAll(){
  if(ALL||!META)return;
  document.getElementById("count").textContent="Loading all collected bills…";
  var jobs=[];Object.keys(META.chunks).forEach(function(ty){META.chunks[ty].forEach(function(k){jobs.push(Site.json("data/billlist/"+CG+"/"+ty+"-"+k+".json").catch(function(){return[]}))})});
  var parts=await Promise.all(jobs);ALL=[].concat.apply([],parts);
}
function ensureAll(){return VIEW==="recent"&&!ALL?loadAll().then(draw):null}
function go(lo,hi){LO=lo;HI=hi;draw();window.scrollTo(0,document.getElementById("pg1").getBoundingClientRect().top+window.pageYOffset-70)}
function draw(){
  if(VIEW==="subjects"&&!SUBJ&&!document.getElementById("find").value.trim().match(/\d/)){drawChooser();return}
  var sb=document.getElementById("sbar");
  sb.innerHTML=VIEW==="subjects"&&SUBJ?'<button id="sback">← All subjects</button> '+(SKIND==="area"?"Policy area: ":"Subject: ")+"<b>"+esc(SUBJ)+"</b>":"";
  if(VIEW==="subjects"&&SUBJ)document.getElementById("sback").onclick=function(){SUBJ=null;LO=HI=1;draw()};
  var rows=current(),L=document.getElementById("list");
  if(rows===null){document.getElementById("count").textContent="Loading all collected bills…";return}
  var q=document.getElementById("find").value.trim();
  if(!q&&VIEW==="most"&&rows.length&&!rows[0].rank){rows.forEach(function(r,i){r.rank=i+1})}
  var pages=Math.max(1,Math.ceil(rows.length/SIZE));if(LO>pages)LO=pages;if(HI>pages)HI=pages;if(HI<LO)HI=LO;
  var pf=filtering()?" matching the filters":"";
  document.getElementById("count").textContent=q?rows.length+" bill"+(rows.length===1?"":"s")+" match"+(filtering()?" the filters too":""):rows.length+" bill"+(rows.length===1?"":"s")+" in this view"+pf;
  L.innerHTML=rows.slice((LO-1)*SIZE,HI*SIZE).map(row).join("")||'<p class="small">Nothing here yet.</p>';
  Site.pager([document.getElementById("pg1"),document.getElementById("pg2")],{total:rows.length,size:SIZE,lo:LO,hi:HI,
    onPage:function(n){go(n,n)},onMore:function(){HI++;draw()},onSize:function(n){SIZE=n;LO=HI=1;draw()}});
}
function filters(){
  var h='<b style="font-size:14px">Filter:</b><select id="chm"><option value="">Both chambers</option><option value="H"'+(CHM==="H"?" selected":"")+'>House bills (H.)</option><option value="S"'+(CHM==="S"?" selected":"")+'>Senate bills (S.)</option></select>';
  h+='<button data-p=""'+(PFX===""?' class="on"':"")+'>All types</button>';
  PFXS.forEach(function(p){if(CHM&&p[0].charAt(0)!==CHM)return;h+='<button data-p="'+p[0]+'"'+(PFX===p[0]?' class="on"':"")+'>'+p[1]+"</button>"});
  var el=document.getElementById("pfx");el.innerHTML=h;
  el.querySelectorAll("button").forEach(function(x){x.onclick=function(){PFX=x.dataset.p;LO=HI=1;filters();draw();ensureAll()}});
  document.getElementById("chm").onchange=function(){CHM=this.value;if(PFX&&CHM&&PFX.charAt(0)!==CHM)PFX="";LO=HI=1;filters();draw();ensureAll()};
}
var SUBJ=null,SKIND="subject",SD=null;
async function loadSubj(){if(SD&&SD.cg===CG)return;try{SD=await Site.json("data/subjects/"+CG+".json");SD.cg=CG}catch(e){SD={cg:CG,subjects:{},areas:{},none:1}}}
function subjectKeys(){var m=SKIND==="area"?SD.areas:SD.subjects;return m[SUBJ]||[]}
function pickSubject(kind,name){SKIND=kind;SUBJ=name;LO=HI=1;document.getElementById("find").value="";draw();if(!ALL)loadAll().then(draw)}
function drawChooser(){
  document.getElementById("pg1").innerHTML="";document.getElementById("pg2").innerHTML="";document.getElementById("sbar").innerHTML="";
  if(!SD){document.getElementById("count").textContent="Loading subjects…";document.getElementById("list").innerHTML="";return}
  var q=document.getElementById("find").value.trim().toLowerCase();
  function chips(map,kind){return Object.keys(map).filter(function(k){return!q||k.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return map[b].length-map[a].length||(a<b?-1:1)}).map(function(k){
    return'<button class="subj" data-k="'+kind+'" data-n="'+esc(k)+'">'+esc(k)+" ("+map[k].length+")</button>"}).join("")}
  var h="";
  if(SD.none)h='<p class="small">No subject data saved yet for this Congress. Subjects are read for bills that have had a roll call vote, became law, or were covered in a hearing, and appear after the next updates.</p>';
  else{var a=chips(SD.areas,"area"),s=chips(SD.subjects,"subject");
    h='<p class="small">Subjects come from the Congressional Research Service and are read only for bills that have had a roll call vote, became law, or were covered in a hearing ('+(SD.bills||0).toLocaleString()+" bills so far). Type in the search box to filter this list.</p>"+
      (a?"<h2>Policy areas</h2><div class=\"chips\">"+a+"</div>":"")+(s?"<h2>Legislative subjects</h2><div class=\"chips\">"+s+"</div>":"")||'<p class="small">No subjects match.</p>'}
  document.getElementById("count").textContent="";document.getElementById("list").innerHTML=h;
  document.querySelectorAll("#list button.subj").forEach(function(x){x.onclick=function(){pickSubject(x.dataset.k,x.dataset.n)}});
}
function views(){
  document.getElementById("views").innerHTML=VIEWS.map(function(v){return'<button data-v="'+v[0]+'"'+(v[0]===VIEW?' class="on"':'')+'>'+v[1]+'</button>'}).join("");
  document.querySelectorAll("#views button").forEach(function(b){b.onclick=function(){VIEW=b.dataset.v;SUBJ=null;LO=HI=1;document.getElementById("find").value="";views();if(VIEW==="subjects"){draw();loadSubj().then(draw)}else if((VIEW==="most"||VIEW==="recent")&&!ALL){draw();loadAll().then(draw)}else draw()}});
}
async function load(){
  document.getElementById("sub").textContent=Site.ordinal(CG)+" Congress. Bills are gathered from members’ sponsored and cosponsored lists, so a new bill can take a few days to appear.";
  ALL=null;META=null;
  var r=await Promise.all([
    Site.json("data/billlist/"+CG+"/meta.json").catch(function(){return null}),
    Site.json("data/billlist/"+CG+"/recent.json").catch(function(){return[]}),
    Site.json("data/laws/"+CG+".json").catch(function(){return{laws:[]}}),
    Site.bills(CG),
    Site.json("data/house/"+CG+"/index.json").catch(function(){return[]}),
    Site.json("data/senate/"+CG+"/index.json").catch(function(){return[]})]);
  META=r[0];RECENT=r[1];
  LAWS=r[2].laws.slice().sort(function(a,b){return(b.date||"")<(a.date||"")?-1:1}).map(function(l){return{y:l.type,n:parseInt(l.number,10),t:l.title,d:l.date,l:l.law,kind:"law"}});
  TB={};Object.keys(r[3].bills||{}).forEach(function(k){TB[k]=r[3].bills[k].t});
  VIDX=r[4].concat(r[5]);
  document.getElementById("cov").textContent=META?(META.total.toLocaleString()+" bills collected"+(META.expected?" of "+META.expected.toLocaleString()+" introduced so far this Congress":"")+". Last built "+Site.fmtDate(META.updated)+"."):"The bill list has not been built yet. It is created by the next update.";
  draw();ensureAll();
}
(async function(){
  Site.nav("bills");
  var info=await Site.congresses(),q=Site.qs();
  CG=parseInt(q.get("congress"),10)||(info?info.latest:119);
  try{(await Site.json("data/members/directory.json")).forEach(function(e){DIR[e.id]=e})}catch(e){}
  var sel=document.getElementById("cg");
  sel.innerHTML=(info?info.congresses:[{congress:CG}]).map(function(x){return'<option value="'+x.congress+'"'+(x.congress===CG?" selected":"")+'>'+Site.ordinal(x.congress)+" Congress</option>"}).join("");
  sel.onchange=function(){CG=parseInt(sel.value,10);LO=HI=1;history.replaceState(null,"","?congress="+CG);load()};
  if(q.get("view")==="subjects"){VIEW="subjects";if(q.get("subject")){SUBJ=q.get("subject");SKIND="subject"}else if(q.get("area")){SUBJ=q.get("area");SKIND="area"}}
  views();filters();
  document.getElementById("find").oninput=async function(){LO=HI=1;if(this.value.trim()&&!ALL)await loadAll();draw()};
  document.getElementById("goform").onsubmit=function(e){e.preventDefault();var n=parseInt(document.getElementById("gn").value,10);if(n>0)location.href="bill.html?congress="+CG+"&type="+document.getElementById("gt").value+"&number="+n};
  await load();
  if(VIEW==="subjects"){await loadSubj();if(SUBJ&&!ALL)await loadAll();draw()}
})();
</script>
</body>
</html>
