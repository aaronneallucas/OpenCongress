name: Update votes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max new votes to fetch per chamber and Congress"
        default: "60"
      leg_budget:
        description: "Max API requests for sponsored/cosponsored bills (0 skips them)"
        default: "150"
      title_budget:
        description: "Max API requests for bill and amendment titles"
        default: "400"
      summary_budget:
        description: "Max API requests for CRS bill summaries (250 summaries per request)"
        default: "80"
      congresses:
        description: "Congresses to update, comma separated (blank = the current Congress, plus the previous one for 21 days after a new Congress begins)"
        default: ""
      force_refresh:
        description: "Backfill: re-read sponsored/cosponsored bills for the Congresses listed above, even if they are finished (needs the list filled in)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-votes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new votes, members and legislation
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          MAX_NEW: ${{ inputs.max_new || '60' }}
          LEG_BUDGET: ${{ inputs.leg_budget || '150' }}
          TITLE_BUDGET: ${{ inputs.title_budget || '400' }}
          SUMMARY_BUDGET: ${{ inputs.summary_budget || '80' }}
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '' }}
          CONGRESSES: ${{ inputs.congresses }}
        run: python update_votes.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "Update vote data"
          # The run can take a long time. If someone pushed to main in the meantime,
          # put our data commit on top of their changes and try again.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 10 seconds"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push after 5 attempts"
          exit 1
