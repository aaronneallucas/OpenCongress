<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Vote Map</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--line:#d9d9d2;
--yes:#1e8e4e;--no:#c62828;
--dy:#1f4e9c;--dn:#8fb4e8;--ry:#b21f1f;--rn:#eba0a0;--iy:#5b2a86;--in:#b99ad6;--pres:#8a8a8a;--vac:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececea;--muted:#9a9a94;--card:#222427;--line:#3a3c40;--yes:#4cc27f;--no:#ef6b6b}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececea;--muted:#9a9a94;--card:#222427;--line:#3a3c40;--yes:#4cc27f;--no:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px clamp(16px,5vw,48px);max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
button,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
.totals{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:4px}
.totals .y{color:var(--yes)}.totals .n{color:var(--no)}
#bar{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line);position:relative}
#bar div{height:100%;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bar .lt{color:#1d1d1b}
#mid{position:absolute;top:0;bottom:0;width:2px;background:var(--bg);transform:translateX(-1px)}
.small{color:var(--muted);font-size:13px;margin:6px 0 14px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
.wrap{overflow-x:auto;padding-bottom:10px}
#map{display:grid;grid-template-columns:repeat(11,80px);gap:10px 6px;width:max-content;margin:0 auto}
.st{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:2px}
.boxes{display:flex;flex-wrap:wrap;gap:2px;width:78px}
.d{width:11px;height:11px;border-radius:2px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.d:hover,.d:focus{outline:2px solid var(--fg);outline-offset:1px}
#tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px;display:none;z-index:20;min-width:170px}
#tip b{display:block;font-size:14px;margin-bottom:2px}
#tip .row{display:flex;justify-content:space-between;gap:12px}
#tip .k{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.cols{grid-template-columns:1fr}}
.list{max-height:380px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.list div{display:flex;gap:8px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line);font-size:14px}
.list div:last-child{border-bottom:0}
.list small{color:var(--muted);margin-left:auto}
.cy{color:var(--yes)}.cn{color:var(--no)}
.nav{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:12px}.nav a{color:var(--fg)}
</style>
</head>
<body>
<h1>House Vote Map</h1>
<p class="sub" id="bill"></p>
<p class="small" id="links"></p>

<div class="nav"><a href="index.html">&larr; All votes</a><a id="newer" style="display:none">&larr; Newer vote</a><a id="older" style="display:none">Older vote &rarr;</a><span class="small" id="stat"></span></div>
<div class="totals"><span class="y" id="ty"></span><span class="n" id="tn"></span></div>
<div id="bar"><span id="mid"></span></div>
<div class="small" id="other"></div>
<p class="small" id="warn"></p>

<div class="legend" id="legend"></div>
<div class="wrap"><div id="map"></div></div>

<div class="filters" id="filters"></div>
<div class="cols">
  <div><h2 class="cy" id="hy"></h2><div class="list" id="ly"></div></div>
  <div><h2 class="cn" id="hn"></h2><div class="list" id="ln"></div></div>
</div>
<div id="tip" role="tooltip"></div>

<script>
var S={AK:[0,0,1],ME:[0,10,2],VT:[1,9,1],NH:[1,10,2],
WA:[2,0,10],ID:[2,1,2],MT:[2,2,2],ND:[2,3,1],MN:[2,4,8],IL:[2,5,17],WI:[2,6,8],MI:[2,7,13],NY:[2,8,26],RI:[2,9,2],MA:[2,10,9],
OR:[3,0,6],NV:[3,1,4],WY:[3,2,1],SD:[3,3,1],IA:[3,4,4],IN:[3,5,9],OH:[3,6,15],PA:[3,7,17],NJ:[3,8,12],CT:[3,9,5],
CA:[4,0,52],UT:[4,1,4],CO:[4,2,8],NE:[4,3,3],MO:[4,4,8],KY:[4,5,6],WV:[4,6,2],VA:[4,7,11],MD:[4,8,8],DE:[4,9,1],
AZ:[5,1,9],NM:[5,2,3],KS:[5,3,4],AR:[5,4,4],TN:[5,5,9],NC:[5,6,14],SC:[5,7,7],
OK:[6,2,5],LA:[6,3,6],MS:[6,4,4],AL:[6,5,7],GA:[6,6,14],
HI:[7,0,2],TX:[7,2,38],FL:[7,7,28]};
var PN={D:"Democratic",R:"Republican",I:"Independent"};
var CV={D:{Y:"--dy",N:"--dn"},R:{Y:"--ry",N:"--rn"},I:{Y:"--iy",N:"--in"}};
var data={},pf="ALL";

function norm(v){v=String(v||"").toLowerCase();
  if(v==="yes"||v==="yea"||v==="aye")return"Y";
  if(v==="no"||v==="nay")return"N";
  if(v==="present")return"P";
  if(v==="not voting"||v==="nv")return"NV";
  return"VAC";}
function key(x){return x?norm(x.vote):"VAC"}
function color(x){
  var k=key(x);
  if(k==="Y"||k==="N"){var c=CV[x.party];return c?"var("+c[k]+")":"var(--pres)"}
  if(k==="P")return"var(--pres)";
  return"var(--vac)";}
function sample(){
  var seed=7,r=function(){seed=(seed*16807)%2147483647;return seed/2147483647};
  var out={},vac=["CA-20","TX-18","NJ-11"];
  var dem=["CA","NY","IL","WA","MA","MD","NJ","CT","OR","CO","VA","MN","NM","HI","RI","DE","VT"];
  Object.keys(S).forEach(function(st){
    for(var i=1;i<=S[st][2];i++){
      var id=st+"-"+(i<10?"0":"")+i;
      if(vac.indexOf(id)>-1){out[id]={rep:"",party:"",vote:"Vacant"};continue}
      var p=r()<(dem.indexOf(st)>-1?.7:.3)?"D":"R",x=r(),v;
      if(x<.03)v="Not Voting";else if(x<.04)v="Present";
      else v=p==="R"?(r()<.92?"Yes":"No"):(r()<.9?"No":"Yes");
      out[id]={rep:"Rep. Sample "+id,party:p,vote:v};
    }});
  return out;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ids(){var a=[];Object.keys(S).forEach(function(st){for(var i=1;i<=S[st][2];i++)a.push(st+"-"+(i<10?"0":"")+i)});return a}

function build(){
  var m=document.getElementById("map");m.innerHTML="";
  Object.keys(S).forEach(function(st){
    var c=document.createElement("div");
    c.style.gridRow=S[st][0]+1;c.style.gridColumn=S[st][1]+1;
    c.innerHTML='<div class="st">'+st+'</div><div class="boxes"></div>';
    for(var i=1;i<=S[st][2];i++){
      var id=st+"-"+(i<10?"0":"")+i,d=document.createElement("div");
      d.className="d";d.dataset.id=id;d.tabIndex=0;d.setAttribute("aria-label",id);
      c.lastChild.appendChild(d);
    }
    m.appendChild(c);});
  var f=document.getElementById("filters");
  f.innerHTML='<span>Show members:</span>';
  [["ALL","All"],["D","Democratic"],["R","Republican"],["I","Independent"]].forEach(function(p){
    var b=document.createElement("button");b.textContent=p[1];b.dataset.p=p[0];
    b.onclick=function(){pf=p[0];lists()};f.appendChild(b);});
  render();}

function render(){
  var cnt={},ay=["D","R","I"],bar=document.getElementById("bar");
  ay.forEach(function(p){cnt[p+"Y"]=0;cnt[p+"N"]=0});
  var P=0,O=0;
  ids().forEach(function(id){
    var x=data[id],k=key(x);
    if((k==="Y"||k==="N")&&CV[x.party])cnt[x.party+k]++;
    else if(k==="P")P++;else O++;});
  document.querySelectorAll(".d").forEach(function(d){d.style.background=color(data[d.dataset.id])});
  var segs=[["D","Y"],["R","Y"],["I","Y"],["D","N"],["R","N"],["I","N"]],tot=0;
  segs.forEach(function(s){tot+=cnt[s[0]+s[1]]});
  var yes=cnt.DY+cnt.RY+cnt.IY,no=cnt.DN+cnt.RN+cnt.IN;
  bar.querySelectorAll("div").forEach(function(e){e.remove()});
  var mid=document.getElementById("mid");
  segs.forEach(function(s){
    var n=cnt[s[0]+s[1]];if(!n)return;
    var e=document.createElement("div");
    e.style.width=(n/tot*100)+"%";e.style.background="var("+CV[s[0]][s[1]]+")";
    if(s[1]==="N")e.className="lt";
    e.textContent=n>=12?n:"";e.title=PN[s[0]]+" "+(s[1]==="Y"?"YES":"NO")+": "+n;
    bar.insertBefore(e,mid);});
  mid.style.left=(tot?yes/tot*100:50)+"%";
  document.getElementById("ty").textContent="YES "+yes;
  document.getElementById("tn").textContent="NO "+no;
  document.getElementById("other").textContent="Present: "+P+"  ·  Not voting / vacant: "+O;
  var L=[["--dy","Democratic YES"],["--dn","Democratic NO"],["--ry","Republican YES"],["--rn","Republican NO"]];
  if(cnt.IY+cnt.IN)L.push(["--iy","Independent YES"],["--in","Independent NO"]);
  L.push(["--pres","Present"],["--vac","Not voting / vacant"]);
  document.getElementById("legend").innerHTML=L.map(function(l){return'<span><i class="sw" style="background:var('+l[0]+')"></i>'+l[1]+'</span>'}).join("");
  lists();}

function lists(){
  document.querySelectorAll("#filters button").forEach(function(b){b.classList.toggle("on",b.dataset.p===pf)});
  var Y=[],N=[];
  ids().forEach(function(id){
    var x=data[id],k=key(x);
    if(!x||(k!=="Y"&&k!=="N"))return;
    if(pf!=="ALL"&&x.party!==pf)return;
    (k==="Y"?Y:N).push([id,x]);});
  function fill(el,arr){
    el.innerHTML=arr.length?arr.map(function(a){
      return'<div><i class="sw" style="background:'+color(a[1])+'"></i>'+esc(a[1].rep)+'<small>'+a[1].party+' · '+(a[1].guess?a[0].split("-")[0]:a[0])+'</small></div>'}).join(""):'<div><small>None</small></div>';}
  fill(document.getElementById("ly"),Y);fill(document.getElementById("ln"),N);
  document.getElementById("hy").textContent="Voted YES ("+Y.length+")";
  document.getElementById("hn").textContent="Voted NO ("+N.length+")";}

var tip=document.getElementById("tip");
function show(d){
  var id=d.dataset.id,x=data[id],k=key(x),dl=x&&x.guess?id.split("-")[0]+" (unknown)":id,h="<b>"+(k==="VAC"||!x?"Vacant":esc(x.rep))+"</b>"+'<div class="row"><span class="k">District</span><span>'+dl+'</span></div>';
  if(k==="VAC"||!x){}
  else{
    var vt=k==="Y"?'<span class="cy"><b style="display:inline">YES</b></span>':k==="N"?'<span class="cn"><b style="display:inline">NO</b></span>':k==="P"?"Present":"Not voting";
    h+='<div class="row"><span class="k">Party</span><span>'+esc(PN[x.party]||x.party)+'</span></div>'+
       '<div class="row"><span class="k">Vote</span>'+vt+'</div>';}
  tip.innerHTML=h;tip.style.display="block";
  var r=d.getBoundingClientRect(),w=tip.offsetWidth,hh=tip.offsetHeight;
  tip.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+"px";
  var t=r.top-hh-8;tip.style.top=(t<8?r.bottom+8:t)+"px";}
var mp=document.getElementById("map");
function isD(e){return e.target.classList.contains("d")}
mp.addEventListener("mouseover",function(e){if(isD(e))show(e.target)});
mp.addEventListener("mouseout",function(e){if(isD(e))tip.style.display="none"});
mp.addEventListener("focusin",function(e){if(isD(e))show(e.target)});
mp.addEventListener("focusout",function(){tip.style.display="none"});
mp.addEventListener("click",function(e){if(isD(e))show(e.target)});
var SN={Alabama:"AL",Alaska:"AK",Arizona:"AZ",Arkansas:"AR",California:"CA",Colorado:"CO",Connecticut:"CT",Delaware:"DE","District of Columbia":"DC",Florida:"FL",Georgia:"GA",Hawaii:"HI",Idaho:"ID",Illinois:"IL",Indiana:"IN",Iowa:"IA",Kansas:"KS",Kentucky:"KY",Louisiana:"LA",Maine:"ME",Maryland:"MD",Massachusetts:"MA",Michigan:"MI",Minnesota:"MN",Mississippi:"MS",Missouri:"MO",Montana:"MT",Nebraska:"NE",Nevada:"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND",Ohio:"OH",Oklahoma:"OK",Oregon:"OR",Pennsylvania:"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD",Tennessee:"TN",Texas:"TX",Utah:"UT",Vermont:"VT",Virginia:"VA",Washington:"WA","West Virginia":"WV",Wisconsin:"WI",Wyoming:"WY"};
var roll=null,dmap=null;
function did(st,d){if(!d)d=1;return st+"-"+(d<10?"0":"")+d}
function parseMap(j){
  var m={};
  if(Array.isArray(j)){j.forEach(function(p){var t=p.terms&&p.terms[p.terms.length-1];
    if(t&&t.type==="rep"&&p.id&&p.id.bioguide)m[p.id.bioguide]=did(t.state,t.district)})}
  else if(j.members){j.members.forEach(function(p){
    if(p.district!=null&&p.bioguideId)m[p.bioguideId]=did(SN[p.state]||p.state,p.district)})}
  else m=j;
  return m;}
function conv(){
  var R=roll.houseRollCallVoteMemberVotes,out={},by={},guessed=0;
  R.results.forEach(function(m){
    var d=dmap&&dmap[m.bioguideID],
        x={rep:m.firstName+" "+m.lastName,party:m.voteParty,vote:m.voteCast};
    if(d&&S[d.split("-")[0]]&&!out[d])out[d]=x;
    else{x.last=m.lastName;(by[m.voteState]=by[m.voteState]||[]).push(x)}});
  Object.keys(by).forEach(function(st){
    if(!S[st])return;
    by[st].sort(function(a,b){return a.last<b.last?-1:1});
    var n=1;
    by[st].forEach(function(x){
      var id;do{id=st+"-"+(n<10?"0":"")+n++}while(out[id]);
      x.guess=true;guessed++;out[id]=x})});
  data=out;
  document.getElementById("bill").textContent=(R.legislationType?R.legislationType+" — ":"")+R.voteQuestion+" ("+R.result+", Roll Call "+R.rollCallNumber+(R.startDate?", "+fmtDate(R.startDate):"")+")";
  document.getElementById("warn").textContent=guessed?guessed+" member(s) have no district number saved, so they are placed in their state's boxes in alphabetical order.":"";
  render();}
var INDEX=[];
function stat(t){document.getElementById("stat").textContent=t}
function fmtDate(d){if(!d)return"";var t=new Date(d);return isNaN(t)?d:t.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function vkey(v){return v.congress+"-"+v.session+"-"+v.roll}
var BT={HR:"house-bill",S:"senate-bill",HRES:"house-resolution",SRES:"senate-resolution",HJRES:"house-joint-resolution",SJRES:"senate-joint-resolution",HCONRES:"house-concurrent-resolution",SCONRES:"senate-concurrent-resolution"};
function billLink(j){
  if(j.billUrl&&/^https:\/\//.test(j.billUrl))return j.billUrl;
  var m=(j.bill||"").match(/^([A-Za-z]+)\s+(\d+)$/),t=m&&BT[m[1].toUpperCase()];
  return t?"https://www.congress.gov/bill/"+j.congress+"/"+t+"/"+m[2]:null;}
function showLinks(j){
  var el=document.getElementById("links");el.textContent="";
  function add(text,href){var a=document.createElement("a");a.textContent=text;a.href=href;a.target="_blank";a.rel="noopener";
    if(el.firstChild)el.appendChild(document.createTextNode(" \u00b7 "));el.appendChild(a)}
  var b=billLink(j);
  if(b)add("View "+(j.bill||"bill")+" on Congress.gov",b);
  if(j.amendment){var am=j.amendment.match(/^([A-Za-z]+)\s+(\d+)$/);
    if(am){var side=am[1].toUpperCase().indexOf("S")===0?"senate-amendment":"house-amendment";
      add("View amendment "+j.amendment,"https://www.congress.gov/amendment/"+j.congress+"th-congress/"+side+"/"+am[2])}}
}
async function openVote(v){
  try{
    stat("Loading\u2026");
    var r=await fetch(v.file);if(!r.ok)throw new Error("HTTP "+r.status);
    var j=await r.json(),res=[];dmap={};
    j.members.forEach(function(m){
      res.push({bioguideID:m.id,firstName:m.first,lastName:m.last,voteParty:m.party,voteState:m.state,voteCast:m.vote});
      if(m.district!=null)dmap[m.id]=did(m.state,m.district)});
    roll={houseRollCallVoteMemberVotes:{legislationType:j.bill||"",legislationNumber:"",voteQuestion:j.question||"",result:j.result||"",rollCallNumber:j.roll,startDate:j.date,results:res}};
    conv();showLinks(j);stat("");
    document.title="Roll Call "+j.roll+" \u2014 House Vote Map";
  }catch(e){stat("Could not load that vote ("+e.message+")")}}
function go(){
  var k=location.hash.slice(1),i=-1;
  INDEX.forEach(function(v,n){if(vkey(v)===k)i=n});
  if(i<0){stat("Vote not found. Use \u201cAll votes\u201d to pick one.");return}
  var nw=document.getElementById("newer"),od=document.getElementById("older");
  nw.style.display=i>0?"":"none";if(i>0)nw.href="#"+vkey(INDEX[i-1]);
  od.style.display=i<INDEX.length-1?"":"none";if(i<INDEX.length-1)od.href="#"+vkey(INDEX[i+1]);
  openVote(INDEX[i]);}
data={};build();
(async function(){
  try{var r=await fetch("data/index.json");if(!r.ok)throw new Error("HTTP "+r.status);INDEX=await r.json()}
  catch(e){stat("Could not load the vote list ("+e.message+")");return}
  INDEX.sort(function(a,b){return(b.date||"")<(a.date||"")?-1:1});
  if(!location.hash&&INDEX.length)location.hash="#"+vkey(INDEX[0]);
  else go();
})();
window.addEventListener("hashchange",go);
</script>
</body>
</html>
