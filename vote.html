<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote Map</title>
<link rel="stylesheet" href="site.css">
<style>
:root{--b:11px}
body{max-width:1700px}
.nav2{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:10px 0}
h1 .pill{font-size:15px;vertical-align:middle;margin-left:8px}
.dl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45);flex:none}
.wrap{overflow-x:auto;padding-bottom:10px}
#map{display:flex;gap:16px;align-items:flex-start;width:max-content;margin:0 auto}
.col{display:flex;flex-direction:column;gap:12px}
.st{font-size:11px;font-weight:600;color:var(--muted);height:13px;line-height:13px;margin-bottom:1px}
.boxes{display:flex;flex-wrap:wrap;gap:2px}
.d{width:var(--b);height:var(--b);border-radius:2px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.d:hover,.d:focus{outline:2px solid var(--fg);outline-offset:1px}
.d.hit{outline:3px solid #f2b300;outline-offset:1px;position:relative;z-index:1}
#tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:14px;display:none;z-index:20;min-width:200px}
#tip .nm{font-size:19px;font-weight:700;line-height:1.2;padding-bottom:7px}
#tip .pr{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-top:1px solid #d9d9d9}
#tip .k{color:var(--muted)}
#tip .vy{color:var(--yes);font-weight:700}#tip .vn{color:var(--no);font-weight:700}
.searchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
#q{flex:1 1 280px;max-width:420px;width:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.list{overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.list.big{max-height:380px}.list.p{max-height:110px}.list.nv{max-height:230px}
.list div{display:flex;gap:8px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line);font-size:14px}
.list div:last-child{border-bottom:0}
.list a{text-decoration:none}.list a:hover{text-decoration:underline}
.list small{color:var(--muted);margin-left:auto;white-space:nowrap}
.stack h2{margin-top:0}.stack .list+h2{margin-top:12px}
</style>
</head>
<body>
<div id="nav"></div>
<h1 id="h1"><span id="ht">Vote Map</span><span class="pill" id="tr" style="display:none"></span></h1>
<p class="sub" id="bill"></p>
<p id="ctx" style="font-size:17px;margin:4px 0 10px;max-width:900px"></p>
<p class="small" id="ttl" style="margin:0 0 4px"></p>
<p class="small" id="links"></p>

<div class="nav2"><a id="back" href="votes.html">&larr; All votes</a><a id="newer" style="display:none">&larr; Newer vote</a><a id="older" style="display:none">Older vote &rarr;</a><span class="small" id="stat"></span></div>
<p class="small" id="warn"></p>
<div id="yb" class="yb" style="display:none"></div>
<div class="vtop">
<div class="vleft"><div id="ptab"></div><div id="tally"></div><div class="small" id="other"></div><div class="lg2" id="legend"></div></div>
<div class="vright"><div class="wrap"><div id="map"></div></div></div>
</div>
<div class="dl"><span>Download:</span><button id="dpng">PNG</button><button id="dsvg">SVG</button><button id="dcsv">CSV</button></div>

<div class="searchrow"><input id="q" type="search" placeholder="Search members by name, state, or district" aria-label="Search members"><span class="small" id="qn" style="margin:0"></span></div>
<div class="filters" id="filters"></div>
<div class="cols">
  <div><h2 class="cy" id="hy"></h2><div class="list big" id="ly"></div></div>
  <div><h2 class="cn" id="hn"></h2><div class="list big" id="ln"></div></div>
  <div class="stack">
    <h2 class="cg" id="hp"></h2><div class="list p" id="lp"></div>
    <h2 class="cg" id="hv"></h2><div class="list nv" id="lv"></div>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script src="site.js"></script>
<script>
var S={AK:[0,0,1],ME:[0,10,2],VT:[1,9,1],NH:[1,10,2],
WA:[2,0,10],ID:[2,1,2],MT:[2,2,2],ND:[2,3,1],MN:[2,4,8],IL:[2,5,17],WI:[2,6,8],MI:[2,7,13],NY:[2,8,26],RI:[2,9,2],MA:[2,10,9],
OR:[3,0,6],NV:[3,1,4],WY:[3,2,1],SD:[3,3,1],IA:[3,4,4],IN:[3,5,9],OH:[3,6,15],PA:[3,7,17],NJ:[3,8,12],CT:[3,9,5],
CA:[4,0,52],UT:[4,1,4],CO:[4,2,8],NE:[4,3,3],MO:[4,4,8],KY:[4,5,6],WV:[4,6,2],VA:[4,7,11],MD:[4,8,8],DE:[4,9,1],
AZ:[5,1,9],NM:[5,2,3],KS:[5,3,4],AR:[5,4,4],TN:[5,5,9],NC:[5,6,14],SC:[5,7,7],
OK:[6,2,5],LA:[6,3,6],MS:[6,4,4],AL:[6,5,7],GA:[6,6,14],
HI:[7,0,2],TX:[7,2,38],FL:[7,7,28]};
var SEN={};Object.keys(S).forEach(function(st){SEN[st]=[S[st][0],S[st][1],2]});
var T=S,CH="house",CG=119,B=11,INDEX=[],KEY="";
var PN={D:"Democratic",R:"Republican",I:"Independent"};
var HEX=Site.HEX,esc=Site.esc,fmtDate=Site.fmtDate;
var data={},pf="ALL",cur=null;
var CW=[6,3,6,3,3,4,4,6,3,3,3]; /* max boxes per row in each map column */

function layout(){
  var cols=[];
  Object.keys(T).forEach(function(st){var c=T[st][1];(cols[c]=cols[c]||[]).push({st:st,r:T[st][0],n:T[st][2]})});
  return cols.map(function(list,c){
    list.sort(function(a,b){return a.r-b.r});
    var w=0;
    list.forEach(function(x){x.rows=Math.ceil(x.n/CW[c]);x.w=Math.ceil(x.n/x.rows);w=Math.max(w,x.w)});
    return{states:list,w:w}});}
function norm(v){v=String(v||"").toLowerCase();
  if(v==="yes"||v==="yea"||v==="aye"||v==="guilty")return"Y";
  if(v==="no"||v==="nay"||v==="not guilty")return"N";
  if(v==="present")return"P";
  if(v==="not voting"||v==="nv")return"NV";
  return"VAC";}
function key(x){return x?norm(x.vote):"VAC"}
function color(x){
  var k=key(x);
  if(k==="Y"||k==="N")return HEX[x.party.toLowerCase()+k]||HEX.P;
  if(k==="P")return HEX.P;
  return HEX.VAC;}
function ids(){var a=[];Object.keys(T).forEach(function(st){for(var i=1;i<=T[st][2];i++)a.push(st+"-"+(i<10?"0":"")+i)});return a}
function counts(){
  var c={dY:0,dN:0,rY:0,rN:0,iY:0,iN:0,dP:0,rP:0,iP:0,dNV:0,rNV:0,iNV:0,P:0,NV:0,VAC:0};
  ids().forEach(function(id){var x=data[id],k=key(x);
    if(k==="Y"||k==="N")c[x.party.toLowerCase()+k]++;
    else if(k==="P"){c.P++;if(x.party)c[x.party.toLowerCase()+"P"]=(c[x.party.toLowerCase()+"P"]||0)+1}
    else if(k==="NV"){c.NV++;if(x.party)c[x.party.toLowerCase()+"NV"]=(c[x.party.toLowerCase()+"NV"]||0)+1}
    else c.VAC++});
  c.yes=c.dY+c.rY+c.iY;c.no=c.dN+c.rN+c.iN;return c;}
function legendItems(c){
  var L=[[HEX.dY,"D Yes"],[HEX.dN,"D No"],[HEX.rY,"R Yes"],[HEX.rN,"R No"]];
  if(c.iY+c.iN)L.push([HEX.iY,"I Yes"],[HEX.iN,"I No"]);
  L.push([HEX.P,"Present"],[HEX.VAC,"Not voting / vacant"]);return L;}
function legendHTML(c){
  var P=[["D","dY","dN"],["R","rY","rN"]];if(c.iY+c.iN)P.push(["I","iY","iN"]);
  var h=P.map(function(p){return'<div><b class="ltr" style="background:'+HEX[p[1]]+'">'+p[0]+'</b><i class="sw" style="background:'+HEX[p[1]]+'"></i>Yes<i class="sw" style="background:'+HEX[p[2]]+';margin-left:8px"></i>No</div>'}).join("");
  h+='<div><i class="sw" style="background:'+HEX.P+'"></i>Present<i class="sw" style="background:'+HEX.VAC+';margin-left:8px"></i>Not voting / vacant</div>';
  return h;}
function where(id,x){return CH==="senate"?id.split("-")[0]:(x&&x.guess?id.split("-")[0]+" (unknown)":id)}

function build(){
  document.documentElement.style.setProperty("--b",B+"px");
  var m=document.getElementById("map");m.innerHTML="";
  layout().forEach(function(col){
    var cd=document.createElement("div");cd.className="col";
    col.states.forEach(function(s){
      var c=document.createElement("div");
      c.innerHTML='<div class="st">'+s.st+'</div><div class="boxes" style="width:'+(s.w*(B+2)-2)+'px"></div>';
      for(var i=1;i<=s.n;i++){
        var id=s.st+"-"+(i<10?"0":"")+i,d=document.createElement("div");
        d.className="d";d.dataset.id=id;d.tabIndex=0;d.setAttribute("aria-label",id);
        c.lastChild.appendChild(d);
      }
      cd.appendChild(c)});
    m.appendChild(cd)});
  var f=document.getElementById("filters");
  f.innerHTML='<span>Show members:</span>';
  [["ALL","All"],["D","Democratic"],["R","Republican"],["I","Independent"]].forEach(function(p){
    var b=document.createElement("button");b.textContent=p[1];b.dataset.p=p[0];
    b.onclick=function(){pf=p[0];lists()};f.appendChild(b);});
  render();}

function render(){
  var c=counts();
  document.querySelectorAll(".d").forEach(function(d){d.style.background=color(data[d.dataset.id])});
  var rp0=Site.resultPill(cur&&cur.result);
  document.getElementById("ptab").innerHTML=Site.partyTable(c,rp0&&rp0.known?rp0.c==="y":null);
  document.getElementById("tally").innerHTML=Site.tallyHTML(c,true);
  document.getElementById("other").textContent=c.VAC?"Vacant: "+c.VAC:"";
  document.getElementById("legend").innerHTML=legendHTML(c);
  lists();}

function lists(){
  document.querySelectorAll("#filters button").forEach(function(b){b.classList.toggle("on",b.dataset.p===pf)});
  var terms=document.getElementById("q").value.toLowerCase().split(/\s+/).filter(Boolean);
  var G={Y:[],N:[],P:[],NV:[]};
  ids().forEach(function(id){
    var x=data[id],k=key(x);
    if(!x||!G[k])return;
    if(pf!=="ALL"&&x.party!==pf)return;
    var hay=(x.rep+" "+x.state+" "+id+" "+id.replace("-"," ")).toLowerCase();
    for(var i=0;i<terms.length;i++)if(hay.indexOf(terms[i])<0)return;
    G[k].push([id,x]);});
  var cmp=function(a,b){var A=a[1],B2=b[1];return(A.last||"").localeCompare(B2.last||"",undefined,{sensitivity:"base"})||(A.first||"").localeCompare(B2.first||"",undefined,{sensitivity:"base"})||(a[0]<b[0]?-1:1)};
  ["Y","N","P","NV"].forEach(function(k){G[k].sort(cmp)});
  function fill(el,arr){
    el.innerHTML=arr.length?arr.map(function(a){
      var x=a[1];
      return'<div><i class="sw" style="background:'+color(x)+'"></i><a href="'+Site.memberHref(x.id,CG)+'">'+esc(x.rep)+'</a><small>'+x.party+' · '+where(a[0],x)+'</small></div>'}).join(""):'<div><small>None</small></div>';}
  fill(document.getElementById("ly"),G.Y);fill(document.getElementById("ln"),G.N);
  fill(document.getElementById("lp"),G.P);fill(document.getElementById("lv"),G.NV);
  document.getElementById("hy").textContent="Voted YES ("+G.Y.length+")";
  document.getElementById("hn").textContent="Voted NO ("+G.N.length+")";
  document.getElementById("hp").textContent="Present ("+G.P.length+")";
  document.getElementById("hv").textContent="Not voting ("+G.NV.length+")";
  var total=G.Y.length+G.N.length+G.P.length+G.NV.length,ring=null;
  if(terms.length&&total===1)ring=[].concat(G.Y,G.N,G.P,G.NV)[0][0];
  document.querySelectorAll(".d").forEach(function(d){d.classList.toggle("hit",d.dataset.id===ring)});
  document.getElementById("qn").textContent=terms.length?(total===1?"1 match (circled in gold on the map)":total+" matches"):"";}

var tip=document.getElementById("tip");
function show(d){
  var id=d.dataset.id,x=data[id],k=key(x),vac=(k==="VAC"||!x);
  var h='<div class="nm">'+(vac?"Vacant":esc(x.rep))+"</div>"+'<div class="pr"><span class="k">'+(CH==="senate"?"State":"District")+'</span><span>'+where(id,x)+"</span></div>";
  if(!vac){
    var vt=k==="Y"?'<span class="vy">YES</span>':k==="N"?'<span class="vn">NO</span>':k==="P"?"Present":"Not voting";
    h+='<div class="pr"><span class="k">Party</span><span>'+esc(PN[x.party]||x.party)+'</span></div>'+
       '<div class="pr"><span class="k">Vote</span><span>'+vt+'</span></div>';}
  tip.innerHTML=h;tip.style.display="block";
  var r=d.getBoundingClientRect(),w=tip.offsetWidth,hh=tip.offsetHeight;
  tip.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+"px";
  var t=r.top-hh-8;tip.style.top=(t<8?r.bottom+8:t)+"px";}
var mp=document.getElementById("map");
function isD(e){return e.target.classList.contains("d")}
mp.addEventListener("mouseover",function(e){if(isD(e))show(e.target)});
mp.addEventListener("mouseout",function(e){if(isD(e))tip.style.display="none"});
mp.addEventListener("focusin",function(e){if(isD(e))show(e.target)});
mp.addEventListener("focusout",function(){tip.style.display="none"});
mp.addEventListener("click",function(e){if(isD(e))show(e.target)});
document.getElementById("q").addEventListener("input",lists);

function did(st,d){if(!d)d=1;return st+"-"+(d<10?"0":"")+d}
function load(j){
  cur=j;
  var out={},by={},guessed=0;
  j.members.forEach(function(m){
    var p=m.party,x={id:m.id,first:m.first,last:m.last,rep:((m.first||"")+" "+(m.last||"")).trim(),party:(p==="D"||p==="R")?p:"I",vote:m.vote,state:m.state};
    var d=(CH==="house"&&m.district!=null)?did(m.state,m.district):null;
    if(d&&T[m.state]&&!out[d])out[d]=x;
    else(by[m.state]=by[m.state]||[]).push(x)});
  Object.keys(by).forEach(function(st){
    if(!T[st])return;
    by[st].sort(function(a,b){return(a.last||"")<(b.last||"")?-1:1});
    var n=1;
    by[st].forEach(function(x){
      var id;do{id=st+"-"+(n<10?"0":"")+n++}while(out[id]);
      if(n-1>T[st][2])return;
      if(CH==="house"){x.guess=true;guessed++}
      out[id]=x})});
  data=out;
  var rp=Site.resultPill(j.result),tr=document.getElementById("tr");
  tr.style.display=rp&&rp.known?"":"none";if(rp&&rp.known){tr.textContent=rp.text.charAt(0)+rp.text.slice(1).toLowerCase();tr.className="pill "+rp.c}
  document.getElementById("ht").textContent=Site.voteTitle(j);
  document.title=Site.voteTitle(j)+" \u2014 "+Site.chamberName(CH);
  document.getElementById("bill").textContent=[Site.chamberName(CH)+" \u00b7 "+Site.ordinal(j.congress||CG)+" Congress",j.question,j.date?fmtDate(j.date):"",rp&&!rp.known?j.result:""].filter(Boolean).join(" \u00b7 ");
  var extra=[];
  if(j.title&&j.title!==j.question)extra.push(j.title);
  if(j.majority&&j.majority!=="1/2")extra.push("Required majority: "+j.majority);
  if(j.tieBreaker)extra.push("Tie broken by "+j.tieBreaker);
  document.getElementById("ttl").textContent=extra.join(" · ");
  document.getElementById("warn").textContent=guessed?guessed+" member(s) have no district number saved, so they are placed in their state's boxes in alphabetical order.":"";
  render();}

function vkey(v){return v.session+"-"+v.roll}
function showLinks(j){
  var el=document.getElementById("links");el.textContent="";
  function add(text,href){var a=document.createElement("a");a.textContent=text;a.href=href;a.target="_blank";a.rel="noopener";
    if(el.firstChild)el.appendChild(document.createTextNode(" · "));el.appendChild(a)}
  var b=Site.billLink(j),bm=(j.bill||"").match(/^([A-Za-z]+)\s*(\d+)$/);
  if(bm&&bm[1].toUpperCase()!=="PN")add("View "+Site.billLabel(j.bill)+" on Open Congress","bill.html?congress="+j.congress+"&type="+bm[1].toUpperCase()+"&number="+bm[2]);
  var pn=Site.pnParts(j.bill);
  if(pn)add("View nomination PN "+pn.n+(pn.p?"-"+pn.p:"")+" on Open Congress",Site.nomHref(j.congress,pn.n,pn.p));
  if(b)add("View "+(j.bill||"bill")+" on Congress.gov",b);
  if(j.amendment){var am=j.amendment.match(/^([A-Za-z]+)\s*(\d+)$/);
    if(am){var side=am[1].toUpperCase().indexOf("S")===0?"senate-amendment":"house-amendment";
      add("View amendment "+j.amendment,"https://www.congress.gov/amendment/"+Site.ordinal(j.congress)+"-congress/"+side+"/"+am[2])}}
}

/* ---------- downloads ---------- */
function baseName(){return CH+"-vote-"+(cur?cur.congress+"-"+cur.session+"-"+cur.roll:"map")}
function saveBlob(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},3000);}
function wrap(t,n,max){
  var w=t.split(/\s+/),lines=[],l="";
  w.forEach(function(x){if((l+" "+x).trim().length>n&&l){lines.push(l);l=x}else l=(l+" "+x).trim()});
  if(l)lines.push(l);
  if(lines.length>max){lines=lines.slice(0,max);lines[max-1]=lines[max-1].replace(/\s*\S*$/,"")+"…"}
  return lines;}
function buildSVG(){
  var c=counts(),M=40,BOX=CH==="senate"?26:14,GAP=2,PITCH=BOX+GAP,CG2=16,LAB=16,RG=14,F="Helvetica Neue,Helvetica,Arial,sans-serif";
  var L=layout(),mapW=0;
  L.forEach(function(col){col.px=mapW;mapW+=col.w*PITCH-GAP+CG2});mapW-=CG2;
  var W=Math.max(960,mapW+2*M),out=[],y=M;
  var ttl=cur?Site.voteTitle(cur):"Roll call vote";if(ttl.length>70)ttl=ttl.slice(0,69)+"\u2026";
  var rp=Site.resultPill(cur&&cur.result),PF={y:"#1e8e4e",n:"#c62828",g:"#6b6b66"};
  out.push('<text x="'+M+'" y="'+(y+26)+'" font-size="26" font-weight="700" fill="#1d1d1b">'+esc(ttl)+'</text>');
  if(rp&&rp.known){var rt=rp.text.charAt(0)+rp.text.slice(1).toLowerCase(),rw=30+rt.length*9.5,rx0=M+ttl.length*12.6+16;
    out.push('<rect x="'+rx0.toFixed(1)+'" y="'+(y+5)+'" width="'+rw+'" height="26" rx="13" fill="'+PF[rp.c]+'"/><text x="'+(rx0+rw/2).toFixed(1)+'" y="'+(y+23)+'" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">'+esc(rt)+'</text>')}
  y+=44;
  var sub=[CH==="senate"?"U.S. Senate":"U.S. House",cur&&cur.question,cur&&cur.date?fmtDate(cur.date):"",rp&&!rp.known?(cur&&cur.result):""].filter(Boolean).join("  \u00b7  ");
  out.push('<text x="'+M+'" y="'+(y+8)+'" font-size="16" fill="#6b6b66">'+esc(sub)+'</text>');
  y+=34;
  var BW=420,tot=c.yes+c.no;
  out.push('<rect x="'+M+'" y="'+y+'" width="96" height="26" rx="13" fill="#1e8e4e"/><text x="'+(M+48)+'" y="'+(y+18)+'" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">YES '+c.yes+'</text>');
  out.push('<rect x="'+(M+106)+'" y="'+y+'" width="84" height="26" rx="13" fill="#c62828"/><text x="'+(M+148)+'" y="'+(y+18)+'" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">NO '+c.no+'</text>');
  y+=38;
  if(tot){
    var yp=(100*c.yes/tot).toFixed(1),np=(100-parseFloat(yp)).toFixed(1),yw=c.yes/tot*BW;
    function brk(x0,w,label,col){
      out.push('<text x="'+(x0+w/2).toFixed(1)+'" y="'+(y+12)+'" font-size="14" font-weight="700" fill="'+col+'" text-anchor="middle">'+label+'</text>');
      out.push('<path d="M'+(x0+2).toFixed(1)+' '+(y+26)+' V'+(y+19)+' H'+(x0+w-2).toFixed(1)+' V'+(y+26)+'" fill="none" stroke="#666" stroke-width="1.5"/>')}
    if(c.yes)brk(M,yw,yp+"%","#1e8e4e");
    if(c.no)brk(M+yw,BW-yw,np+"%","#c62828");}
  y+=30;
  out.push('<rect x="'+M+'" y="'+y+'" width="'+BW+'" height="20" rx="3" fill="#f1f1ee"/>');
  var bx=M;
  ["dY","rY","iY","dN","rN","iN"].forEach(function(s){
    if(!c[s]||!tot)return;var w=c[s]/tot*BW;
    out.push('<rect x="'+bx.toFixed(2)+'" y="'+y+'" width="'+w.toFixed(2)+'" height="20" fill="'+HEX[s]+'"/>');bx+=w});
  y+=20+20;
  out.push('<text x="'+M+'" y="'+(y+4)+'" font-size="14" fill="#6b6b66">Present: '+c.P+'  ·  Not voting: '+c.NV+'  ·  Vacant: '+c.VAC+'</text>');
  y+=34;
  var mx=(W-mapW)/2,mapH=0;
  L.forEach(function(col){
    var yy=0;
    col.states.forEach(function(s){
      var sx=mx+col.px,sy=y+yy;
      out.push('<text x="'+sx+'" y="'+(sy+11)+'" font-size="11" font-weight="700" fill="#6b6b66">'+s.st+'</text>');
      for(var i=0;i<s.n;i++){
        var id=s.st+"-"+(i+1<10?"0":"")+(i+1),x=data[id],k=key(x);
        var bx2=sx+(i%s.w)*PITCH,by=sy+LAB+Math.floor(i/s.w)*PITCH;
        var tt=(k==="VAC"||!x)?id+": Vacant":x.rep+" ("+x.party+") "+where(id,x)+": "+x.vote;
        out.push('<rect x="'+bx2+'" y="'+by+'" width="'+BOX+'" height="'+BOX+'" rx="2" fill="'+color(x)+'" stroke="#b5b5b5" stroke-width=".6"><title>'+esc(tt)+'</title></rect>')}
      yy+=LAB+s.rows*PITCH+RG});
    mapH=Math.max(mapH,yy-RG)});
  y+=mapH+24;
  var lx=M;
  legendItems(c).forEach(function(l){
    out.push('<rect x="'+lx+'" y="'+(y+2)+'" width="13" height="13" rx="2" fill="'+l[0]+'" stroke="#b5b5b5" stroke-width=".6"/><text x="'+(lx+19)+'" y="'+(y+13)+'" font-size="13" fill="#1d1d1b">'+esc(l[1])+'</text>');
    lx+=19+l[1].length*6.6+18});
  y+=34;
  out.push('<text x="'+M+'" y="'+(y+4)+'" font-size="12" fill="#6b6b66">Data: '+(CH==="senate"?"Senate.gov":"Congress.gov")+'</text>');
  var H=y+M-6;
  return{w:W,h:H,svg:'<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="'+F+'"><rect width="'+W+'" height="'+H+'" fill="#fff"/>'+out.join("")+'</svg>'};}
function csvCell(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCSV(){
  var rows=[];
  ids().forEach(function(id){var x=data[id];if(!x||key(x)==="VAC")return;
    var p=id.split("-");rows.push([p[0],(CH==="senate"||x.guess)?"":parseInt(p[1],10),x.rep,x.party,x.vote,x.id||""])});
  rows.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:(a[1]||0)-(b[1]||0)});
  return["State,District,Name,Party,Vote,Member ID"].concat(rows.map(function(r){return r.map(csvCell).join(",")})).join("\r\n")+"\r\n";}
document.getElementById("dsvg").onclick=function(){saveBlob(new Blob([buildSVG().svg],{type:"image/svg+xml"}),baseName()+".svg")};
document.getElementById("dcsv").onclick=function(){saveBlob(new Blob(["﻿"+buildCSV()],{type:"text/csv;charset=utf-8"}),baseName()+".csv")};
document.getElementById("dpng").onclick=function(){
  var o=buildSVG(),img=new Image();
  img.onload=function(){
    var cv=document.createElement("canvas");cv.width=o.w*2;cv.height=o.h*2;
    var g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(function(b){if(b)saveBlob(b,baseName()+".png");else stat("Could not create the PNG.")},"image/png")};
  img.onerror=function(){stat("Could not create the PNG. Try the SVG instead.")};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(o.svg);};

function stat(t){document.getElementById("stat").textContent=t}
function parseKey(){
  /* new links: house-119-2-327 / senate-119-1-45. Old links: 119-2-327 (House). */
  var p=location.hash.slice(1).split("-");
  if(p[0]==="house"||p[0]==="senate")return{ch:p[0],cg:+p[1],ss:+p[2],roll:+p[3]};
  return{ch:"house",cg:+p[0],ss:+p[1],roll:+p[2]};}
async function youBox(k){
  var el=document.getElementById("yb"),info=await Site.congresses();
  if(!Site.you.on()||!info||k.cg!==info.latest){el.style.display="none";return}
  var cur=Site.you.get(k.cg,k.ch,k.ss,k.roll);
  el.style.display="";
  el.innerHTML='<b>How would you have voted?</b> <button class="yv'+(cur>0?' on y':'')+'" data-v="1">Yes</button><button class="yv'+(cur<0?' on n':'')+'" data-v="-1">No</button><button class="yv" data-v="0">Skip</button> <a href="you.html">Rep. You &rarr;</a><span class="small"> Saved only in this browser.</span>';
  el.querySelectorAll("button").forEach(function(b){b.onclick=function(){Site.you.set(k.cg,k.ch,k.ss,k.roll,parseInt(b.dataset.v,10));youBox(k)}});
}
async function go(){
  var k=parseKey();
  if(!k.cg||!k.ss||!k.roll){stat("Vote not found. Use “All votes” to pick one.");return}
  if(k.ch!==CH||k.cg!==CG||!INDEX.length){
    CH=k.ch;CG=k.cg;T=CH==="senate"?SEN:S;B=CH==="senate"?22:11;
    document.getElementById("back").href="votes.html?chamber="+CH+"&congress="+CG;
    try{
      INDEX=await Site.json("data/"+CH+"/"+CG+"/index.json");
    }catch(e){stat("Could not load the vote list ("+e.message+")");return}
    INDEX.sort(function(a,b){return(b.date||"")<(a.date||"")?-1:(b.date||"")>(a.date||"")?1:(b.session-a.session)||(b.roll-a.roll)});
    data={};build();
  }
  var i=-1;
  INDEX.forEach(function(v,n){if(v.session===k.ss&&v.roll===k.roll)i=n});
  if(i<0){stat("Vote not found. Use “All votes” to pick one.");return}
  var nw=document.getElementById("newer"),od=document.getElementById("older");
  nw.style.display=i>0?"":"none";if(i>0)nw.href=Site.voteHref(CH,CG,INDEX[i-1].session,INDEX[i-1].roll);
  od.style.display=i<INDEX.length-1?"":"none";if(i<INDEX.length-1)od.href=Site.voteHref(CH,CG,INDEX[i+1].session,INDEX[i+1].roll);
  try{
    stat("Loading…");
    var j=await Site.json(INDEX[i].file);
    load(j);showLinks(j);stat("");youBox(k);
    Site.bills(j.congress||k.cg).then(function(T){var c=Site.context(j,T);var el=document.getElementById("ctx");el.textContent=c;el.style.display=c?"":"none"});
  }catch(e){stat("Could not load that vote ("+e.message+")")}}
(async function(){
  Site.nav("votes");
  if(!location.hash){
    var info=await Site.congresses();
    var cg=info?info.latest:119;
    try{
      var idx=await Site.json("data/house/"+cg+"/index.json");
      idx.sort(function(a,b){return(b.date||"")<(a.date||"")?-1:(b.date||"")>(a.date||"")?1:(b.session-a.session)||(b.roll-a.roll)});
      if(idx.length){location.hash="#house-"+cg+"-"+idx[0].session+"-"+idx[0].roll;return}
    }catch(e){}
  }
  go();
})();
window.addEventListener("hashchange",go);
</script>
