<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roll Call Votes</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="nav"></div>
<h1 id="h">Roll Call Votes</h1>
<p class="sub" id="sub"></p>
<input id="find" type="search" placeholder="Search by bill, topic, or roll number" style="margin-bottom:14px">
<div id="pg1"></div>
<div id="list"></div>
<div id="pg2"></div>
<p class="foot" id="msg"></p>
<p class="foot">Data: Congress.gov and Senate.gov</p>
<script src="site.js"></script>
<script>
var IDX = [], SIZE = 50, LO = 1, HI = 1, CH = "house", CG = 119, busy = {};
var HEX = Site.HEX, esc = Site.esc;

function vk(v) { return v.session + "-" + v.roll; }
function bar(v) {
  var segs;
  if ("dY" in v) segs = ["dY", "rY", "iY", "dN", "rN", "iN"].map(function (k) { return [v[k], HEX[k]]; });
  else segs = [[v.yes, "#1e8e4e"], [v.no, "#c62828"]];
  var t = 0;
  segs.forEach(function (s) { t += s[0] || 0; });
  return '<div class="b">' + segs.map(function (s) {
    return s[0] ? '<i style="width:' + (s[0] / t * 100) + '%;background:' + s[1] + '"></i>' : "";
  }).join("") + "</div>";
}
function tally(rows) {
  var t = {dY: 0, dN: 0, rY: 0, rN: 0, iY: 0, iN: 0, present: 0, notVoting: 0};
  rows.forEach(function (m) {
    var x = String(m.vote || "").toLowerCase(), p = String(m.party || "").toUpperCase();
    p = (p === "D" || p === "R") ? p.toLowerCase() : "i";
    if (x === "yea" || x === "aye" || x === "yes" || x === "guilty") t[p + "Y"]++;
    else if (x === "nay" || x === "no" || x === "not guilty") t[p + "N"]++;
    else if (x === "present") t.present++;
    else if (x === "not voting") t.notVoting++;
  });
  return t;
}
async function enrich(v) {
  /* votes saved before party counts existed: work them out from the vote's own file */
  if ("dY" in v || busy[vk(v)] || !v.file) return;
  busy[vk(v)] = 1;
  try {
    var r = await fetch(v.file);
    if (!r.ok) return;
    var j = await r.json();
    Object.assign(v, tally(j.members));
    var row = document.querySelector('.row[data-k="' + vk(v) + '"]');
    if (row) {
      row.querySelector(".bs").innerHTML = bar(v);
      row.querySelector(".x").textContent = "Present " + v.present + " · Not voting " + v.notVoting;
    }
  } catch (e) {}
}
var TB = {};
function draw() {
  var q = document.getElementById("find").value.toLowerCase();
  var f = IDX.filter(function (v) {
    return !q || [v.bill, v.question, v.title, v.result, "roll " + v.roll, v.roll, Site.fmtDate(v.date)].join(" ").toLowerCase().indexOf(q) > -1;
  });
  var pages = Math.max(1, Math.ceil(f.length / SIZE));
  if (LO > pages) LO = pages; if (HI > pages) HI = pages; if (HI < LO) HI = LO;
  var vis = f.slice((LO - 1) * SIZE, HI * SIZE);
  document.getElementById("list").innerHTML = vis.map(function (v) {
    var other = ("present" in v) ? "Present " + v.present + " · Not voting " + v.notVoting : "";
    return '<a class="row" data-k="' + vk(v) + '" href="' + Site.voteHref(CH, CG, v.session, v.roll) + '">' +
      '<div class="t">' + (v.bill ? "<b>" + esc(v.bill) + "</b> · " : "") + esc(v.question || "Roll call") + "</div>" +
      (Site.context(v, TB) ? '<div class="tt">' + esc(Site.clip(Site.context(v, TB), 150)) + "</div>" : "") +
      (v.title && v.title !== v.question ? '<div class="tt">' + esc(v.title) + "</div>" : "") +
      '<div class="m">Roll ' + v.roll + " · " + esc(Site.fmtDate(v.date)) + (v.result ? " · " + esc(v.result) : "") + "</div>" +
      '<div class="bw"><span class="bs">' + bar(v) + '</span><div class="c"><span class="y">YES ' + v.yes + '</span><span class="n">NO ' + v.no + "</span></div></div>" +
      '<div class="x">' + other + "</div></a>";
  }).join("");
  Site.pager([document.getElementById("pg1"), document.getElementById("pg2")], {total: f.length, size: SIZE, lo: LO, hi: HI,
    onPage: function (n) { LO = HI = n; draw(); window.scrollTo(0, document.getElementById("pg1").getBoundingClientRect().top + window.pageYOffset - 70); },
    onMore: function () { HI++; draw(); },
    onSize: function (n) { SIZE = n; LO = HI = 1; draw(); }});
  document.getElementById("msg").textContent = f.length ? "" : (IDX.length ? "No votes match your search." : "");
  vis.forEach(function (v, i) { setTimeout(function () { enrich(v); }, i * 60); });
}
document.getElementById("find").oninput = function () { LO = HI = 1; draw(); };

(async function () {
  Site.nav("votes");
  var q = Site.qs(), info = await Site.congresses();
  CH = q.get("chamber") === "senate" ? "senate" : "house";
  CG = parseInt(q.get("congress"), 10) || (info ? info.latest : 119);
  var title = Site.chamberName(CH) + " Roll Call Votes";
  document.getElementById("h").textContent = title;
  document.getElementById("sub").textContent = Site.ordinal(CG) + " Congress (" + (info ? ((info.congresses.filter(function (x) { return x.congress === CG; })[0] || {}).years || "") : "") + "). Newest first. Select a vote to see how each " + (CH === "senate" ? "senator" : "district") + " voted.";
  document.title = title + " — " + Site.ordinal(CG) + " Congress";
  try {
    IDX = await Site.json("data/" + CH + "/" + CG + "/index.json");
    TB = await Site.bills(CG);
  } catch (e) {
    document.getElementById("msg").textContent = "No saved votes found yet for the " + Site.ordinal(CG) + " Congress " + Site.chamberName(CH) + " (" + e.message + ").";
    return;
  }
  IDX.sort(function (a, b) {
    return (b.date || "") < (a.date || "") ? -1 : (b.date || "") > (a.date || "") ? 1 : (b.session - a.session) || (b.roll - a.roll);
  });
  if (!IDX.length) document.getElementById("msg").textContent = "No saved votes yet.";
  draw();
})();
</script>
</body>
</html>
