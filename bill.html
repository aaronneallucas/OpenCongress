<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill — Open Congress</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="nav"></div>
<p class="small"><a id="back" href="bills.html">&larr; All bills</a></p>
<h1 id="h1">Bill</h1>
<p id="title" style="font-size:17px;max-width:900px"></p>
<div class="cards" id="cards"></div>
<p class="small" id="links"></p>
<p class="small" id="dlrow"><b>Download this bill’s data:</b> <button type="button" id="dlc">Cosponsors (CSV)</button> <button type="button" id="dlj">Bill record (JSON)</button></p>
<div class="panel" id="sump"><h2>Summary</h2><div class="sumtext" id="sum"></div><p class="small" id="sumn"></p></div>
<div class="panel" id="tickp" style="display:none"><h2>Cosponsors by party</h2><div id="ticks" style="line-height:0"></div><p class="small" id="tickn"></p></div>
<div class="panel" id="chp" style="display:none"><h2>Cosponsors over time</h2><div class="chart" id="cch" style="max-width:760px"></div><div class="lg" id="clg"></div><p class="small">Dates are when each member signed on, so the first step is the bill’s original cosponsors. The horizontal axis spans the two years of the Congress.</p></div>
<div class="chips" id="btabs"><button data-t="votes" class="on">Roll call votes</button><button data-t="cos">Cosponsors</button></div>
<div class="panel" id="p-votes"><div id="votes"></div></div>
<div class="panel" id="p-cos" style="display:none"><div id="cosl"></div></div>
<p class="foot">Data: Congress.gov and Senate.gov</p>
<script src="site.js"></script>
<script>
var esc=Site.esc;
function card(k,v,d){return'<div class="card"><div class="k">'+esc(k)+'</div><div class="v" style="font-size:20px">'+v+'</div><div class="d">'+d+"</div></div>"}
(async function(){
  Site.nav("bills");
  var q=Site.qs(),CG=parseInt(q.get("congress"),10),ty=(q.get("type")||"").toUpperCase(),n=parseInt(q.get("number"),10),key=ty+" "+n;
  var label=Site.billLabel(key);
  document.getElementById("h1").textContent=label+" — "+Site.ordinal(CG)+" Congress";document.title=label+" — Open Congress";
  document.getElementById("back").href="bills.html?congress="+CG;
  var meta=await Site.json("data/billlist/"+CG+"/meta.json").catch(function(){return null});
  var rec=null;
  if(meta){try{var rows=await Site.json("data/billlist/"+CG+"/"+ty+"-"+Math.floor((n-1)/(meta.chunk||2000))+".json");rec=rows.filter(function(r){return r.n===n})[0]||null}catch(e){}}
  var r=await Promise.all([Site.bills(CG),Site.json("data/laws/"+CG+".json").catch(function(){return{laws:[]}}),Site.json("data/members/directory.json").catch(function(){return[]}),
    Site.json("data/house/"+CG+"/index.json").catch(function(){return[]}),Site.json("data/senate/"+CG+"/index.json").catch(function(){return[]})]);
  var T=r[0],law=r[1].laws.filter(function(l){return l.type===ty&&parseInt(l.number,10)===n})[0],DIR={};r[2].forEach(function(e){DIR[e.id]=e});
  var title=(rec&&rec.t)||(T.bills[key]&&T.bills[key].t)||(law&&law.title)||"";
  document.getElementById("title").textContent=title||"Title not collected yet.";
  var cards=[],lw=(rec&&rec.l)||(law&&law.law);
  if(rec&&rec.d)cards.push(card("Introduced",esc(Site.fmtDate(rec.d)),""));
  if(rec&&rec.s&&DIR[rec.s]){var e=DIR[rec.s],c=e.c&&e.c[CG]||{};cards.push(card("Sponsor",'<a href="'+Site.memberHref(rec.s,CG)+'">'+esc(e.first+" "+e.last)+"</a>",esc((c.party||rec.sp)+(c.state?"-"+c.state:"")+(c.district?"-"+c.district:""))))}
  if(rec){var tot=(rec.cd||0)+(rec.cr||0)+(rec.ci||0);
    cards.push(card("Cosponsors",String(tot),tot?esc([rec.cd?rec.cd+" Democratic":"",rec.cr?rec.cr+" Republican":"",rec.ci?rec.ci+" other":""].filter(Boolean).join(" · "))+((rec.cd&&rec.cr)?" · <b>bipartisan</b>":""):"None collected"))}
  cards.push(card("Signed into law",lw?'<span class="law" style="font-size:15px">Law '+esc(lw)+"</span>":"No",lw&&(rec&&rec.ld||law&&law.date)?esc(Site.fmtDate((rec&&rec.ld)||law.date)):"Not recorded as enacted"));
  document.getElementById("cards").innerHTML=cards.join("");
  var D=rec?rec.cd||0:0,R=rec?rec.cr||0:0,O=rec?rec.ci||0:0;
  if(D+R+O){document.getElementById("tickp").style.display="";
    var tk=function(c,k){var s="";for(var i=0;i<k;i++)s+='<span style="display:inline-block;width:3px;height:22px;margin:2px 1px;background:'+c+'"></span>';return s};
    document.getElementById("ticks").innerHTML=tk(Site.HEX.dY,D)+tk("#8a8a8a",O)+tk(Site.HEX.rY,R);
    document.getElementById("tickn").textContent="Each tick is one cosponsor: "+D+" Democratic (blue), "+R+" Republican (red)"+(O?", "+O+" other (gray)":"")+"."}
  document.querySelectorAll("#btabs button").forEach(function(x){x.onclick=function(){document.querySelectorAll("#btabs button").forEach(function(y){y.classList.toggle("on",y===x)});
    document.getElementById("p-votes").style.display=x.dataset.t==="votes"?"":"none";document.getElementById("p-cos").style.display=x.dataset.t==="cos"?"":"none"}});
  var cosIds=[];
  if(meta&&rec){try{var cm=await Site.json("data/billlist/"+CG+"/cos-"+ty+"-"+Math.floor((n-1)/(meta.chunk||2000))+".json");cosIds=cm[String(n)]||[]}catch(e){}}
  var cr=cosIds.map(function(x){var id=Array.isArray(x)?x[0]:x,e=DIR[id];return e?{id:id,e:e,c:(e.c&&e.c[CG])||{},date:Array.isArray(x)?x[1]:""}:null}).filter(Boolean).sort(function(a,b){return(a.date||"9")<(b.date||"9")?-1:(a.date||"9")>(b.date||"9")?1:(a.e.last||"")<(b.e.last||"")?-1:1});
  var dated=cr.filter(function(x){return x.date});
  if(dated.length>1){document.getElementById("chp").style.display="";
    var pcd=function(x){return x.c.party==="D"?"D":x.c.party==="R"?"R":"I"};
    var S=[["All cosponsors","#222",dated],["Democratic",Site.HEX.dY,dated.filter(function(x){return pcd(x)==="D"})],["Republican",Site.HEX.rY,dated.filter(function(x){return pcd(x)==="R"})]].filter(function(s){return s[2].length}).map(function(s,i){return{label:s[0],color:s[1],bold:i===0,c:Site.cumulative(s[2],CG)}});
    Site.lineChart(document.getElementById("cch"),S,{w:760,h:280,label:"Cosponsors over time"});
    document.getElementById("clg").innerHTML=S.map(function(s){return'<span><i style="background:'+s.color+'"></i>'+s.label+" ("+s.c.total+")</span>"}).join("")}
  document.querySelector('#btabs [data-t="cos"]').textContent="Cosponsors ("+(rec?D+R+O:0)+")";
  document.getElementById("cosl").innerHTML=cr.length?'<div class="tblwrap"><table class="tbl"><thead><tr><th>Member</th><th>Party</th><th>State</th><th>Date cosponsored</th></tr></thead><tbody>'+cr.map(function(x){return'<tr><td><a href="'+Site.memberHref(x.id,CG)+'">'+esc(x.e.first+" "+x.e.last)+'</a></td><td>'+esc(x.c.party||"")+"</td><td>"+esc((x.c.state||"")+(x.c.district?"-"+x.c.district:""))+"</td><td>"+(x.date?esc(Site.fmtDate(x.date)):"\u2014")+"</td></tr>"}).join("")+"</tbody></table></div>":'<p class="small">No cosponsors collected for this bill.</p>';
  try{
    var sm=(await Site.json("data/summaries/"+CG+"/"+ty+"-"+Math.floor((n-1)/250)+".json"))[String(n)];
    if(sm&&sm.t){
      document.getElementById("sum").innerHTML=sm.t.split(/\n+/).filter(Boolean).map(function(p){return"<p>"+esc(p)+"</p>"}).join("");
      document.getElementById("sumn").textContent="Summary written by the Congressional Research Service"+(sm.a?" for the stage: "+sm.a:"")+(sm.d?" ("+Site.fmtDate(sm.d)+")":"")+". Long summaries are shortened here; the full text is on Congress.gov."
    }else throw 0;
  }catch(e){document.getElementById("sum").innerHTML='<p class="small">No summary collected for this bill. The Congressional Research Service writes summaries only after a bill has moved, and they appear here after the next update.</p>'}
  var fn=(ty+"-"+n+"-"+CG).replace(/[^A-Za-z0-9\-]+/g,"_");
  document.getElementById("dlc").onclick=function(){Site.saveFile(fn+"-cosponsors.csv",Site.csv(["Member id","Name","Party","State","District","Date cosponsored"],
    cr.map(function(x){return[x.id,x.e.first+" "+x.e.last,x.c.party,x.c.state,x.c.district||"",x.date||""]})))};
  document.getElementById("dlj").onclick=function(){Site.saveFile(fn+".json",JSON.stringify({bill:key,congress:CG,title:title,record:rec,law:law||null,
    cosponsors:cr.map(function(x){return{id:x.id,name:x.e.first+" "+x.e.last,party:x.c.party,state:x.c.state,district:x.c.district||null,date:x.date||null}}),
    votes:votes_for_download()},null,1),"application/json")};
  function votes_for_download(){var o=[];r[3].concat(r[4]).forEach(function(v){if(v.bill===key)o.push({chamber:v.chamber,session:v.session,roll:v.roll,date:v.date,question:v.question,result:v.result,yes:v.yes,no:v.no})});return o}
  var url=Site.billUrl(ty,n,CG);
  document.getElementById("links").innerHTML=url?'<a href="'+url+'" target="_blank" rel="noopener">View '+esc(label)+" on Congress.gov</a>":"";
  var votes=[];r[3].forEach(function(v){if(v.bill===key)votes.push(v)});r[4].forEach(function(v){if(v.bill===key)votes.push(v)});
  votes.sort(function(a,b){return(b.date||"")<(a.date||"")?-1:1});
  document.getElementById("votes").innerHTML=votes.map(function(v){var rp=Site.resultPill(v.result),ctx=Site.context(v,T);
    return'<a class="row" href="'+Site.voteHref(v.chamber,CG,v.session,v.roll)+'"><div class="t"><b>'+esc(Site.chamberName(v.chamber))+" Roll Call "+v.roll+"</b> · "+esc(v.question||"")+(rp&&rp.known?' <span class="pill '+rp.c+'" style="font-size:11px;padding:1px 8px">'+esc(rp.text)+"</span>":"")+"</div>"+
      (v.amendment?'<div class="tt">'+esc(Site.clip(ctx,200))+"</div>":"")+'<div class="m">'+esc(Site.fmtDate(v.date))+(v.yes!=null?" · Yes "+v.yes+" · No "+v.no:"")+"</div></a>"}).join("")||'<p class="small">No roll call votes on this bill have been saved.</p>';
})();
</script>
</body>
</html>
