<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voting Relationships</title>
<link rel="stylesheet" href="site.css">
<style>
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 4px}
#mapwrap{position:relative}
#mapwrap{border:1px solid var(--line);border-radius:8px;background:#fff}
#mapwrap svg{display:block;width:100%;height:auto;position:relative;z-index:1}
#ecv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;border-radius:8px}
#mtip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;z-index:5;white-space:nowrap}
#mtip b{font-size:15px;display:block}
.dot{cursor:pointer}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.big{font-size:34px;font-weight:800;line-height:1.1}
.res{margin:10px 0 0}
</style>
</head>
<body>
<div id="nav"></div>
<h1>Voting Relationships</h1>
<p class="sub" id="sub">How alike members voted, using every roll call in the chosen Congress.</p>
<div class="ctl"><label>Chamber <select id="ch"><option value="house">House</option><option value="senate">Senate</option></select></label>
  <label>Congress <select id="cg"></select></label></div>

<div class="panel">
  <h2>Voting map</h2>
  <div class="ctl"><input id="mq" type="search" placeholder="Find a member on the map" style="flex:1 1 260px;max-width:380px;width:auto"><span class="small" id="mn" style="margin:0"></span></div>
  <div class="ctl">
    <label>Layout <select id="lay"><option value="network">Network (spread out)</option><option value="axes">Axes (two patterns)</option></select></label>
    <label><input type="checkbox" id="econ" checked style="width:auto"> Show connections</label>
    <label>Minimum agreement <input type="range" id="emin" min="0" max="100" step="1" value="0" style="width:160px;padding:0;vertical-align:middle"> <b id="eval">0%</b></label>
    <span class="small" id="ecount" style="margin:0"></span>
  </div>
  <div id="mapwrap"><canvas id="ecv" width="1800" height="1040"></canvas><div id="map"></div><div id="mtip"></div></div>
  <div class="legend" id="mleg" style="display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13px"></div>
  <div class="legend" id="eleg" style="display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:4px;font-size:13px"></div>
  <p class="small" id="mnote"></p>
</div>

<div class="panel">
  <h2>Compare two members</h2>
  <div class="pair">
    <div><input id="pa" list="dl" placeholder="First member (type a name)" autocomplete="off"></div>
    <div><input id="pb" list="dl" placeholder="Second member" autocomplete="off"></div>
  </div>
  <datalist id="dl"></datalist>
  <div class="res" id="pres"><span class="small">Pick two members to see how often they voted the same way.</span></div>
</div>
<p class="foot">Data: Congress.gov and Senate.gov</p>
<script src="site.js"></script>
<script>
var esc=Site.esc,CH="house",CG=119,MX=null,IDX={},DIR=[],LIST=[],BYID={},LABELS={},POS={};
var PCOL={D:Site.HEX.dY,R:Site.HEX.rY,I:Site.HEX.iY,Y:"#111"},PN={D:"Democratic",R:"Republican",I:"Independent",Y:"Rep. You"},LATEST=0,YOUN=0,YOUMAP=false;
function pcode(p){return p==="D"||p==="R"||p==="Y"?p:"I"}
function mh(id){return id==="YOU"?"you.html":Site.memberHref(id,CG)}

/* ---- principal components of the vote matrix (Yea=+1, Nay=-1, other = member average) ---- */
function pca(ids){
  var V=MX.votes.length,n=ids.length,X=new Array(n),mean=new Float64Array(V),cnt=new Float64Array(V),i,j,it;
  for(i=0;i<n;i++){X[i]=new Float64Array(V);var s=MX.members[ids[i]];
    for(j=0;j<V;j++){var v=Site.sgn(s[j]);if(v){X[i][j]=v;mean[j]+=v;cnt[j]++}}}
  var keep=[];
  for(j=0;j<V;j++){mean[j]=cnt[j]?mean[j]/cnt[j]:0;if(cnt[j]>=5)keep.push(j)}
  for(i=0;i<n;i++){var s2=MX.members[ids[i]];
    for(var k=0;k<keep.length;k++){j=keep[k];X[i][j]=Site.sgn(s2[j])?X[i][j]-mean[j]:0}}
  var K=keep.length;
  function mulX(v){var r=new Float64Array(n);for(var a=0;a<n;a++){var row=X[a],t=0;for(var b=0;b<K;b++)t+=row[keep[b]]*v[b];r[a]=t}return r}
  function mulXt(u){var r=new Float64Array(K);for(var a=0;a<n;a++){var row=X[a],ua=u[a];if(!ua)continue;for(var b=0;b<K;b++)r[b]+=row[keep[b]]*ua}return r}
  function norm(v){var t=0;for(var a=0;a<v.length;a++)t+=v[a]*v[a];t=Math.sqrt(t)||1;for(a=0;a<v.length;a++)v[a]/=t;return t}
  var comps=[];
  for(var c=0;c<2;c++){
    var v=new Float64Array(K);for(j=0;j<K;j++)v[j]=Math.sin(j*12.9898+c*78.233+1)*0.5+0.5;
    for(it=0;it<80;it++){
      comps.forEach(function(p){var d=0;for(var a=0;a<K;a++)d+=v[a]*p[a];for(a=0;a<K;a++)v[a]-=d*p[a]});
      v=mulXt(mulX(v));norm(v)}
    comps.push(v)}
  return comps.map(function(v){return mulX(v)});
}

var W=900,H=520,PAD=30,MODE="network",MAPIDS=[],EDGES=[],AGM=null,IX={},HOVER=null,SEARCH=null,OFF=null,EKEY="";
var ECOL={Y:["#111","You to anyone"],DD:["#1f4e9c","Democrat to Democrat"],RR:["#b21f1f","Republican to Republican"],DR:["#8a8a8a","Democrat to Republican"],I:["#5b2a86","Independent to anyone"]};
function eclass(a,b){var x=pcode(BYID[a].c[CG].party),y=pcode(BYID[b].c[CG].party);
  if(x==="Y"||y==="Y")return"Y";if(x==="I"||y==="I")return"I";if(x==="D"&&y==="D")return"DD";if(x==="R"&&y==="R")return"RR";return"DR"}

/* ---- how alike every pair voted (all pairs, kept in a matrix and a sorted list) ---- */
function computeEdges(){
  var ids=MAPIDS,n=ids.length,key=CH+"-"+CG+"-"+n;
  if(key===EKEY)return;EKEY=key;
  var V=MX.votes.length,S=[],cast=[],i,j,k;
  for(i=0;i<n;i++){var str=MX.members[ids[i]],a=new Int8Array(V),c=0;for(k=0;k<V;k++){a[k]=Site.sgn(str[k]);if(a[k])c++}S.push(a);cast.push(c)}
  EDGES=[];AGM=new Float32Array(n*n);AGM.fill(NaN);
  for(i=0;i<n;i++)for(j=i+1;j<n;j++){
    var A=S[i],B=S[j],same=0,com=0;
    for(k=0;k<V;k++){var x=A[k],y=B[k];if(x&&y){com++;if(x===y)same++}}
    if(com>=Math.max(10,0.5*Math.min(cast[i],cast[j]))){var pc=100*same/com;AGM[i*n+j]=pc;AGM[j*n+i]=pc;EDGES.push([i,j,pc,com])}}
  EDGES.sort(function(a,b){return a[2]-b[2]||a[3]-b[3]});
}

/* ---- layout 1: the two strongest voting patterns, stretched so each party is not one blob ---- */
function axesLayout(ids){
  var sc=pca(ids),n=ids.length,i;
  var sd=0,nd=0,sr=0,nr=0;
  ids.forEach(function(id,i){var p=pcode(BYID[id].c[CG].party);if(p==="D"){sd+=sc[0][i];nd++}else if(p==="R"){sr+=sc[0][i];nr++}});
  if(nd&&nr&&sd/nd>sr/nr)for(i=0;i<n;i++)sc[0][i]=-sc[0][i];
  var s2=0;for(i=0;i<n;i++)if(sc[0][i]>0)s2+=sc[1][i];
  if(s2<0)for(i=0;i<n;i++)sc[1][i]=-sc[1][i];
  var u=[],v=[],mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(i=0;i<n;i++){mnx=Math.min(mnx,sc[0][i]);mxx=Math.max(mxx,sc[0][i]);mny=Math.min(mny,sc[1][i]);mxy=Math.max(mxy,sc[1][i])}
  for(i=0;i<n;i++){u.push((sc[0][i]-mnx)/((mxx-mnx)||1));v.push((sc[1][i]-mny)/((mxy-mny)||1))}
  var grp={D:[],R:[]};
  ids.forEach(function(id,i){var p=pcode(BYID[id].c[CG].party);if(grp[p])grp[p].push(i)});
  [u,v].forEach(function(arr){["D","R"].forEach(function(p){
    var ix=grp[p];if(ix.length<3)return;
    var vals=ix.map(function(i){return arr[i]}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),span=(hi-lo)||1;
    var order=ix.slice().sort(function(a,b){return arr[a]-arr[b]}),rank={};
    order.forEach(function(i,r){rank[i]=r/(order.length-1)});
    ix.forEach(function(i){arr[i]=lo+span*(0.3*(arr[i]-lo)/span+0.7*rank[i])})})});
  return {x:u.map(function(a){return PAD+a*(W-2*PAD)}),y:v.map(function(a){return H-PAD-a*(H-2*PAD)})};
}
/* ---- layout 2: network. Each member is pulled toward the colleagues they vote most like and pushed away from everyone ---- */
function networkLayout(ids){
  var a=axesLayout(ids),X=a.x.slice(),Y=a.y.slice(),n=ids.length,i,j,links=[];
  for(i=0;i<n;i++){
    var pi=pcode(BYID[ids[i]].c[CG].party),same=[],cross=[];
    for(j=0;j<n;j++){if(j===i)continue;var p=AGM[i*n+j];if(p!==p)continue;
      ((pi==="I"||pi==="Y"||pcode(BYID[ids[j]].c[CG].party)===pi)?same:cross).push([j,p])}
    same.sort(function(x,y){return y[1]-x[1]});cross.sort(function(x,y){return y[1]-x[1]});
    same.slice(0,8).forEach(function(c){links.push([i,c[0],1])});
    cross.slice(0,2).forEach(function(c){links.push([i,c[0],0.25])});
  }
  var area=(W-2*PAD)*(H-2*PAD),k=0.85*Math.sqrt(area/n),T0=W/12,iters=n>200?260:400,dx=new Float64Array(n),dy=new Float64Array(n);
  for(var it=0;it<iters;it++){
    dx.fill(0);dy.fill(0);
    for(i=0;i<n;i++)for(j=i+1;j<n;j++){
      var ex=X[i]-X[j],ey=Y[i]-Y[j],f=k*k/(ex*ex+ey*ey+0.01);
      dx[i]+=ex*f;dy[i]+=ey*f;dx[j]-=ex*f;dy[j]-=ey*f}
    for(var q=0;q<links.length;q++){var l=links[q],lx=X[l[0]]-X[l[1]],ly=Y[l[0]]-Y[l[1]],g=l[2]*(Math.sqrt(lx*lx+ly*ly)+0.01)/k;
      dx[l[0]]-=lx*g;dy[l[0]]-=ly*g;dx[l[1]]+=lx*g;dy[l[1]]+=ly*g}
    var t=T0*(1-it/iters)+0.3;
    for(i=0;i<n;i++){var m=Math.sqrt(dx[i]*dx[i]+dy[i]*dy[i])||1,sc=Math.min(m,t)/m;
      X[i]=Math.max(PAD,Math.min(W-PAD,X[i]+dx[i]*sc));Y[i]=Math.max(PAD,Math.min(H-PAD,Y[i]+dy[i]*sc))}
  }
  var mnx=Math.min.apply(null,X),mxx=Math.max.apply(null,X),mny=Math.min.apply(null,Y),mxy=Math.max.apply(null,Y);
  for(i=0;i<n;i++){X[i]=PAD+(X[i]-mnx)/((mxx-mnx)||1)*(W-2*PAD);Y[i]=PAD+(Y[i]-mny)/((mxy-mny)||1)*(H-2*PAD)}
  return {x:X,y:Y};
}
/* nudge overlapping dots apart so none sit on top of each other */
function declump(X,Y,r){
  var n=X.length,min=2*r+1.5,i,j;
  for(var it=0;it<40;it++){
    var moved=0;
    for(i=0;i<n;i++)for(j=i+1;j<n;j++){
      var dx=X[j]-X[i],dy=Y[j]-Y[i],d2=dx*dx+dy*dy;
      if(d2<min*min){var d=Math.sqrt(d2);if(d<0.01){dx=Math.cos(i*2.4);dy=Math.sin(i*2.4);d=1}
        var push=(min-d)/2/d;X[i]-=dx*push;Y[i]-=dy*push;X[j]+=dx*push;Y[j]+=dy*push;moved++}}
    for(i=0;i<n;i++){X[i]=Math.max(PAD,Math.min(W-PAD,X[i]));Y[i]=Math.max(PAD,Math.min(H-PAD,Y[i]))}
    if(!moved)break}
}

function drawMap(){
  var el=document.getElementById("map");
  var need=0;LIST.forEach(function(e){if(e.id!=="YOU")need=Math.max(need,Site.castCount(MX.members[e.id]||""))});
  var ids=LIST.filter(function(e){return e.id==="YOU"||Site.castCount(MX.members[e.id]||"")>=0.3*need}).map(function(e){return e.id});
  var skipped=LIST.length-ids.length;
  if(ids.length<5){el.innerHTML='<p class="small">Not enough votes saved yet to draw a map.</p>';return}
  HOVER=null;MAPIDS=ids;IX={};ids.forEach(function(id,i){IX[id]=i});
  computeEdges();
  var L=MODE==="axes"?axesLayout(ids):networkLayout(ids),R=CH==="senate"?6:4.5;
  declump(L.x,L.y,R);
  POS={};var party={D:[],R:[],I:[],Y:[]};
  ids.forEach(function(id,i){POS[id]=[L.x[i],L.y[i]];party[pcode(BYID[id].c[CG].party)].push(id)});
  var dots="";
  ["D","I","R","Y"].forEach(function(p){party[p].forEach(function(id){
    dots+='<circle class="dot" data-id="'+esc(id)+'" cx="'+POS[id][0].toFixed(1)+'" cy="'+POS[id][1].toFixed(1)+'" r="'+(p==="Y"?R+3.5:R)+'" fill="'+PCOL[p]+'" stroke="'+(p==="Y"?"#f2b300":"#fff")+'" stroke-width="'+(p==="Y"?2.5:1.2)+'"/>'})});
  var g=dots;
  if(MODE==="axes")g+='<text x="'+PAD+'" y="'+(H-6)+'" font-size="12" fill="#6b6b66">← votes more with the Democratic majority</text>'+
     '<text x="'+(W-PAD)+'" y="'+(H-6)+'" font-size="12" fill="#6b6b66" text-anchor="end">votes more with the Republican majority →</text>';
  el.innerHTML='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Voting map of members">'+g+'</svg>';
  document.getElementById("mleg").innerHTML=["D","R","I","Y"].filter(function(p){return party[p].length}).map(function(p){
    return'<span><i class="sw" style="background:'+PCOL[p]+'"></i>'+PN[p]+" ("+party[p].length+")</span>"}).join("");
  document.getElementById("mnote").textContent=(MODE==="axes"
    ?"Each dot is a member. Positions come from the two strongest patterns in how members voted; the horizontal axis mostly separates the parties and the vertical axis shows the next biggest pattern. Within each party the dots are spread out so they do not pile up, so distances are not to scale."
    :"Each dot is a member. Members are pulled toward the colleagues they vote most like and pushed away from everyone else, so dots that are closer together generally voted more alike. Directions and exact distances have no meaning, and the picture is only a summary of the votes.")+
    " Hover a member to light up all of their connections." + (skipped?" "+skipped+" member(s) who cast too few Yea/Nay votes are left off.":"")+(YOUMAP&&CG===LATEST?(YOUN>=10?" The black dot with the gold ring is you (Rep. You), placed from your picks.":" Rep. You is on but needs at least 10 Yes/No picks in the "+(CH==="house"?"House":"Senate")+" to appear (you have "+YOUN+"). Mark votes on the Rep. You page."):"");
  var svg=el.querySelector("svg"),tip=document.getElementById("mtip"),wrap=document.getElementById("mapwrap");
  svg.addEventListener("mousemove",function(e){
    var d=e.target.closest&&e.target.closest(".dot");
    if(!d){tip.style.display="none";return}
    var m=BYID[d.dataset.id],c=m.c[CG],r=wrap.getBoundingClientRect();
    tip.innerHTML="<b>"+esc(m.first+" "+m.last)+"</b>"+esc(m.id==="YOU"?"Your picks":(PN[pcode(c.party)]||c.party)+" · "+c.state+(CH==="house"&&c.district?"-"+c.district:""));
    tip.style.display="block";
    var l=e.clientX-r.left+14;if(l+tip.offsetWidth>r.width)l=e.clientX-r.left-tip.offsetWidth-14;
    tip.style.left=Math.max(0,l)+"px";tip.style.top=Math.max(0,e.clientY-r.top-10)+"px"});
  svg.addEventListener("mouseover",function(e){var d=e.target.closest&&e.target.closest(".dot");setHover(d?d.dataset.id:null)});
  svg.addEventListener("mouseleave",function(){tip.style.display="none";setHover(null)});
  svg.addEventListener("click",function(e){var d=e.target.closest&&e.target.closest(".dot");if(d)location.href=mh(d.dataset.id)});
  drawEdges();
  highlight();
}

/* ---- connections: line thickness and darkness show how often two members voted the same way ---- */
function strokeLine(ctx,sx,sy,a,b,col,alpha,w){
  ctx.strokeStyle=col;ctx.globalAlpha=alpha;ctx.lineWidth=w*2;
  ctx.beginPath();ctx.moveTo(POS[a][0]*sx,POS[a][1]*sy);ctx.lineTo(POS[b][0]*sx,POS[b][1]*sy);ctx.stroke()}
function drawEdges(){          /* rebuild the base layer of all connections */
  var cv=document.getElementById("ecv"),on=document.getElementById("econ").checked,thr=parseInt(document.getElementById("emin").value,10);
  document.getElementById("eval").textContent=thr+"%"+(thr===0?" (all connections)":"");
  if(!OFF){OFF=document.createElement("canvas")}
  OFF.width=cv.width;OFF.height=cv.height;
  var ctx=OFF.getContext("2d"),sx=cv.width/W,sy=cv.height/H,leg=document.getElementById("eleg");
  var per={DD:0,RR:0,DR:0,I:0,Y:0},shown=0;
  if(on&&EDGES.length){
    ctx.lineCap="round";
    EDGES.forEach(function(e){            /* weakest first, so the strongest lines end up on top */
      if(e[2]<thr)return;
      var a=MAPIDS[e[0]],b=MAPIDS[e[1]],c=eclass(a,b),p=e[2]/100,q=p*p*p;
      per[c]++;shown++;
      strokeLine(ctx,sx,sy,a,b,ECOL[c][0],0.006+0.2*q,0.1+0.7*q)});
    ctx.globalAlpha=1;
    document.getElementById("ecount").textContent=shown.toLocaleString()+" connection"+(shown===1?"":"s");
    leg.innerHTML=Object.keys(ECOL).filter(function(c){return per[c]||(c!=="I"&&c!=="Y")}).map(function(c){return'<span><i class="sw" style="background:'+ECOL[c][0]+';height:3px;margin-top:4px"></i>'+ECOL[c][1]+" ("+per[c].toLocaleString()+")</span>"}).join("")+
      '<span style="color:var(--muted)">Thicker, darker line = voted alike more often; weak ties are very faint. Hover a member to see all of their connections.</span>';
  }else{document.getElementById("ecount").textContent="";leg.innerHTML=""}
  paintEdges();
}
function paintEdges(){         /* show the base layer, or fade it and light up the hovered member's connections */
  var cv=document.getElementById("ecv"),ctx=cv.getContext("2d"),sx=cv.width/W,sy=cv.height/H;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!OFF)return;
  if(!HOVER){ctx.drawImage(OFF,0,0);return}
  ctx.globalAlpha=0.08;ctx.drawImage(OFF,0,0);
  var n=MAPIDS.length,i=IX[HOVER],mine=[],j;
  for(j=0;j<n;j++){if(j===i)continue;var p=AGM[i*n+j];if(p===p)mine.push([j,p])}
  mine.sort(function(a,b){return a[1]-b[1]});
  ctx.lineCap="round";
  mine.forEach(function(m){
    var o=MAPIDS[m[0]],c=eclass(HOVER,o),p=m[1]/100;
    strokeLine(ctx,sx,sy,HOVER,o,ECOL[c][0],0.07+0.8*p*p,0.35+1.7*p*p*p)});
  ctx.globalAlpha=1;
}
function setHover(id){
  if(id===HOVER)return;
  HOVER=id;paintEdges();applyDots();
}
function applyDots(){
  var svg=document.querySelector("#map svg");if(!svg)return;
  var n=MAPIDS.length;
  svg.querySelectorAll(".dot").forEach(function(d){
    var id=d.dataset.id,o=(SEARCH&&!SEARCH[id])?0.12:1;
    if(HOVER&&id!==HOVER){var p=AGM[IX[HOVER]*n+IX[id]];p=(p===p)?p/100:0;o*=0.1+0.9*p*p}
    d.setAttribute("fill-opacity",o);d.setAttribute("stroke-opacity",Math.max(o,0.15));
    d.setAttribute("stroke",id===HOVER?"#222":id==="YOU"?"#f2b300":"#fff");d.setAttribute("stroke-width",id===HOVER?2:id==="YOU"?2.5:1.2)});
}
function highlight(){
  var q=document.getElementById("mq").value.toLowerCase().split(/\s+/).filter(Boolean),svg=document.querySelector("#map svg");
  var old=svg&&svg.querySelector("#ring");if(old)old.remove();
  var hits=[];
  if(q.length)LIST.forEach(function(e){
    if(!POS[e.id])return;var c=e.c[CG],hay=(e.first+" "+e.last+" "+c.state).toLowerCase();
    if(q.every(function(t){return hay.indexOf(t)>-1}))hits.push(e)});
  document.getElementById("mn").textContent=q.length?(hits.length===1?"1 match (circled in gold)":hits.length+" matches"):"";
  SEARCH=null;
  if(q.length){SEARCH={};hits.forEach(function(h){SEARCH[h.id]=1})}
  applyDots();
  if(svg&&hits.length===1){var p=POS[hits[0].id];
    svg.insertAdjacentHTML("beforeend",'<circle id="ring" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="11" fill="none" stroke="#f2b300" stroke-width="3" pointer-events="none"/>')}
}

/* ---- compare two members ---- */
function pick(v){return LABELS[v.trim()]||null}
function comparePair(){
  var a=pick(document.getElementById("pa").value),b=pick(document.getElementById("pb").value),out=document.getElementById("pres");
  if(!a||!b){out.innerHTML='<span class="small">Pick two members from the suggestions to see how often they voted the same way.</span>';return}
  if(a===b){out.innerHTML='<span class="small">Choose two different members.</span>';return}
  var A=BYID[a],B=BYID[b],r=Site.agree(MX.members[a],MX.members[b]);
  if(!r.common){out.innerHTML='<span class="small">These two members have no Yea/Nay roll calls in common in this Congress.</span>';return}
  var diffs=[];
  MX.votes.forEach(function(sr,i){var x=Site.sgn(MX.members[a][i]),y=Site.sgn(MX.members[b][i]);
    if(x&&y&&x!==y){var v=IDX[sr[0]+"-"+sr[1]];if(v)diffs.push({v:v,x:x})}});
  diffs.sort(function(p,q){return(q.v.date||"")<(p.v.date||"")?-1:(q.v.date||"")>(p.v.date||"")?1:(q.v.roll-p.v.roll)});
  var nm=function(m){return'<a href="'+mh(m.id)+'">'+esc(m.first+" "+m.last)+"</a>"};
  out.innerHTML='<div class="big">'+r.pct.toFixed(1)+'%</div><p style="margin:2px 0 10px">'+nm(A)+" and "+nm(B)+" voted the same way on "+r.same+" of "+r.common+
    " roll calls where both voted Yea or Nay. They voted differently on "+(r.common-r.same)+".</p>"+
    (diffs.length?'<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Vote</th><th>Description</th><th>'+esc(A.last)+"</th><th>"+esc(B.last)+"</th></tr></thead><tbody>"+
      diffs.slice(0,50).map(function(d){var v=d.v;
        return"<tr><td>"+esc(Site.fmtDate(v.date))+'</td><td><a href="'+Site.voteHref(CH,CG,v.session,v.roll)+'">Roll '+v.roll+"</a></td><td>"+(v.bill?"<b>"+esc(v.bill)+"</b> · ":"")+esc(v.question||"")+
          '</td><td class="'+(d.x>0?"cy":"cn")+'"><b>'+(d.x>0?"YES":"NO")+'</b></td><td class="'+(d.x>0?"cn":"cy")+'"><b>'+(d.x>0?"NO":"YES")+"</b></td></tr>"}).join("")+
      "</tbody></table></div>"+(diffs.length>50?'<p class="small">Showing the 50 most recent of '+diffs.length+" disagreements.</p>":""):"");
}
document.getElementById("pa").oninput=comparePair;document.getElementById("pb").oninput=comparePair;
document.getElementById("mq").oninput=highlight;
document.getElementById("econ").onchange=drawEdges;
document.getElementById("lay").onchange=function(){MODE=this.value;SEARCH=SEARCH;drawMap()};
document.getElementById("emin").oninput=drawEdges;

async function load(){
  document.getElementById("pres").innerHTML='<span class="small">Loading…</span>';
  document.getElementById("map").innerHTML='<p class="small">Loading…</p>';
  try{
    var r=await Promise.all([Site.json("data/"+CH+"/"+CG+"/matrix.json"),Site.json("data/"+CH+"/"+CG+"/index.json")]);
    MX=r[0];IDX={};r[1].forEach(function(v){IDX[v.session+"-"+v.roll]=v});
  }catch(e){document.getElementById("map").innerHTML='<p class="small">Voting data is not available yet ('+esc(e.message)+").</p>";return}
  LIST=DIR.filter(function(e){var s=e.c&&e.c[CG];return s&&s.chamber===CH&&MX.members[e.id]});
  LIST.sort(function(a,b){return(a.last+a.first)<(b.last+b.first)?-1:1});
  YOUN=0;
  if(YOUMAP&&CG===LATEST){var yv=Site.you.vec(MX,CG,CH);YOUN=(yv.match(/[yn]/g)||[]).length;
    if(YOUN>=10){MX.members.YOU=yv;var yc={};yc[CG]={party:"Y",state:"",district:"",chamber:CH};LIST.push({id:"YOU",first:"Rep.",last:"You",c:yc})}}
  BYID={};LABELS={};
  var opts="";
  LIST.forEach(function(e){BYID[e.id]=e;var c=e.c[CG],lab=e.last+", "+e.first+" ("+pcode(c.party)+"-"+c.state+(CH==="house"&&c.district?"-"+c.district:"")+")";
    LABELS[lab]=e.id;opts+='<option value="'+esc(lab)+'">'});
  document.getElementById("dl").innerHTML=opts;
  var q=Site.qs();
  [["a","pa"],["b","pb"]].forEach(function(x){var id=q.get(x[0]);
    document.getElementById(x[1]).value="";
    if(id&&BYID[id]){Object.keys(LABELS).forEach(function(l){if(LABELS[l]===id)document.getElementById(x[1]).value=l})}});
  drawMap();comparePair();
}
function setUrl(){history.replaceState(null,"","?chamber="+CH+"&congress="+CG+(YOUMAP?"&you=1":""))}
(async function(){
  var q=Site.qs(),info=await Site.congresses();
  YOUMAP=q.get("you")==="1"&&Site.you.on();
  Site.nav(YOUMAP?"you":"relationships");
  if(YOUMAP){document.querySelector("h1").textContent="Rep. You: your voting map";
    document.querySelector("h1").insertAdjacentHTML("afterend",'<p class="small"><a href="you.html">&larr; Back to Rep. You</a></p>')}
  LATEST=info?info.latest:119;
  CH=q.get("chamber")==="senate"?"senate":"house";
  CG=parseInt(q.get("congress"),10)||(info?info.latest:119);
  var list=info?info.congresses:[{congress:119,years:"2025–2027",chambers:["house","senate"]}];
  document.getElementById("ch").value=CH;
  document.getElementById("cg").innerHTML=list.map(function(x){return'<option value="'+x.congress+'">'+Site.ordinal(x.congress)+" ("+x.years+")</option>"}).join("");
  document.getElementById("cg").value=CG;
  document.getElementById("ch").onchange=function(){CH=this.value;setUrl();load()};
  document.getElementById("cg").onchange=function(){CG=parseInt(this.value,10);setUrl();load()};
  try{DIR=await Site.json("data/members/directory.json")}
  catch(e){document.getElementById("map").innerHTML='<p class="small">Member data is not available yet ('+esc(e.message)+").</p>";return}
  load();
})();
</script>
