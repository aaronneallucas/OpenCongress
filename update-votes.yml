name: Update votes
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_votes.py
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          CONGRESS: "119"
          SESSIONS: "1,2"
      - name: Commit new votes
        run: |
          git config user.name "vote-bot"
          git config user.email "vote-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Add new votes" && git push)
